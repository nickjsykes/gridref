<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Grid Ref</title>
<meta name="description" content="Find and share Ordnance Survey grid references on your phone.">
<meta name="theme-color" content="#2f5d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grid Ref">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=37">
<style>
  :root {
    --green: #2f5d3a;
    --green-soft: #e3ece4;
    --ink: #1c211d;
    --muted: #5f6b62;
    --panel: #ffffff;
    --line: #dde3de;
    --danger: #a33a2a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --green: #7fbf8c;
      --green-soft: #22332a;
      --ink: #eef2ee;
      --muted: #a3ada6;
      --panel: #161a17;
      --line: #2c332e;
      --danger: #ff8a75;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, button, a, input, .sheet, .drawer, .top, .fabs, .layers, .results { touch-action: manipulation; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--panel); color: var(--ink); font-family: var(--sans); }
  #map { position: fixed; inset: 0; background: #dfe6df; }

  /* search */
  .top { position: fixed; z-index: 1000; left: 12px; right: 12px; top: calc(var(--safe-t) + 10px); display: flex; gap: 8px; }
  .search { flex: 1; display: flex; background: var(--panel); border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 16px var(--sans); padding: 12px 14px; outline: none; }
  .search button { border: 0; background: none; color: var(--green); font: 600 15px var(--sans); padding: 0 14px; }
  .results { max-height: 55vh; overflow-y: auto; position: fixed; z-index: 1001; left: 12px; right: 12px; top: calc(var(--safe-t) + 62px); background: var(--panel); border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.2); overflow: hidden; display: none; }
  .results button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); font: 15px var(--sans); padding: 13px 14px; }
  .results button small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .results button .tag { float: right; font: 600 11px var(--sans); color: var(--green); background: var(--green-soft); border-radius: 6px; padding: 2px 6px; margin-left: 8px; }
  .results .msg { padding: 13px 14px; color: var(--muted); font-size: 14px; }

  /* crosshair */
  .cross { position: fixed; z-index: 900; left: 50%; top: var(--cross-y, 40%); width: 44px; height: 44px; margin: -22px 0 0 -22px; pointer-events: none; }
  .cross::before, .cross::after { content: ""; position: absolute; background: #c0392b; box-shadow: 0 0 0 1.5px rgba(255,255,255,.85); }
  .cross::before { left: 21px; top: 0; width: 2px; height: 44px; }
  .cross::after { top: 21px; left: 0; height: 2px; width: 44px; }

  /* floating buttons */
  .fabs { position: fixed; z-index: 1000; right: 12px; display: flex; flex-direction: column; gap: 10px; bottom: calc(var(--sheet-h, 230px) + 12px); }
  .fab { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--panel); color: var(--ink); box-shadow: 0 2px 10px rgba(0,0,0,.22); display: grid; place-items: center; }
  .fab svg { width: 24px; height: 24px; }
  .fab.on { background: var(--green); color: var(--panel); }
  .fab { position: relative; }
  .fabs.left { right: auto; left: 12px; }
  body.measuring .fabs.left, body.navigating .fabs.left { display: none; }
  /* GPS accuracy, always in view once GPS is on: green good, amber so-so, red poor */
  .acc { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); font: 700 11px var(--sans); color: #fff; background: #1f8a4c; padding: 1px 6px; border-radius: 9px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .acc.mid { background: #c98a00; }
  .acc.poor { background: #c0392b; }
  body.large .acc { font-size: 13px; }

  /* bottom sheet */
  .sheet { position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0; background: var(--panel); border-radius: 18px 18px 0 0; box-shadow: 0 -2px 16px rgba(0,0,0,.18); padding: 14px 16px max(10px, calc(var(--safe-b) - 14px)); display: flex; flex-direction: column; max-height: 60vh; }
  .grab { display: block; width: 100%; border: 0; background: none; padding: 0 0 8px; margin-top: -6px; touch-action: none; }
  .grab span { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
  .sheet.compact .more { display: none; }
  .more { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
  .meta { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .meta { flex-wrap: wrap; column-gap: 10px; row-gap: 0; }
  .meta:has(.from-me:empty) { display: none; }
  .big { display: flex; align-items: center; width: 100%; gap: 10px; border: 0; background: none; color: var(--ink); padding: 4px 8px 2px; text-align: left; }
  .ref { flex: 1; font: 700 clamp(26px, 8.6vw, 36px)/1.15 var(--mono); letter-spacing: .01em; white-space: nowrap; }
  .ref.off { font-size: 20px; color: var(--muted); font-family: var(--sans); font-weight: 500; }
  .c { display: inline-flex; align-items: center; gap: 4px; color: var(--green); font: 600 13px var(--sans); flex: none; border-radius: 10px; transition: background .15s; }
  .c svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .refline { display: flex; align-items: center; gap: 10px; }
  .refline .big { flex: 1; min-width: 0; }
  .refline .prec { flex-direction: column; flex: none; }
  .refline .prec button { padding: 6px 10px; }
  .row .c { padding: 4px 0; }
  .rows { margin-top: 6px; border-top: 1px solid var(--line); flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); padding: 9px 8px; text-align: left; }
  .row .k { width: 80px; flex: none; font: 600 12px var(--sans); color: var(--muted); }
  .row .v { flex: 1; min-width: 0; font: 14.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .v.dim { font-family: var(--sans); color: var(--muted); font-size: 14px; }
  /* Copied: the whole thing goes green with a tick, plus a toast, so nobody wonders */
  label.big, label.row { cursor: pointer; -webkit-user-select: none; user-select: none; }
  .big, .row { position: relative; border-radius: 10px; transition: background .15s, color .15s; }
  .copied { background: var(--green) !important; color: #fff !important; }
  .copied .k, .copied .v { color: #fff !important; }
  .big.copied .ref { color: #fff; }
  a.row { text-decoration: none; }
  .row:active, .big:active { opacity: .6; }
  .from-me { font: 600 14px var(--sans); color: var(--green); min-width: 0; padding: 4px 8px; }
  .prec { display: inline-flex; background: var(--green-soft); border-radius: 9px; padding: 2px; }
  .prec button { border: 0; background: none; color: var(--muted); font: 600 13px var(--sans); padding: 5px 10px; border-radius: 7px; }
  .prec button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .actions { display: grid; grid-template-columns: 32px repeat(4, 1fr); gap: 6px; margin-top: 10px; align-items: stretch; }
  .tool { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 2px 6px !important; }
  .tool svg { width: 24px; height: 24px; }
  .tool span { font: 600 11px var(--sans); white-space: nowrap; }
  .tool.small { background: none !important; color: var(--muted) !important; padding: 0 !important; }
  .tool.small svg { width: 26px; height: 26px; }
  .tool.small.on { color: var(--green) !important; }
  .actions button { border: 0; border-radius: 12px; padding: 13px 6px; font: 600 15px var(--sans); background: var(--green-soft); color: var(--green); }
  .actions button.primary { background: var(--green); color: var(--panel); }

  /* saved points drawer */
  .drawer { position: fixed; z-index: 1100; inset: 0; background: var(--panel); display: none; flex-direction: column; padding-top: var(--safe-t); }
  .drawer.open { display: flex; }
  .drawer header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .drawer h2 { margin: 0; font-size: 19px; }
  .drawer header button, .link { border: 0; background: none; color: var(--green); font: 600 16px var(--sans); padding: 6px 0; }
  .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-radius: 10px; padding: 9px 4px; font: 600 15px var(--sans); background: var(--green-soft); color: var(--muted); }
  .tabs button.on { background: var(--green); color: var(--panel); }
  .modal.sheetmenu { align-items: flex-end; padding-bottom: calc(var(--safe-b) + 10px); }
  .sheetmenu .card { gap: 6px; }
  .im-title { display: flex; flex-direction: column; padding: 2px 4px 6px; }
  .im-title b { font-size: 17px; }
  .im-title span { font: 14px var(--mono); color: var(--muted); }
  .sheetmenu button { border: 0; border-radius: 12px; padding: 13px; font: 600 16px var(--sans); background: var(--green-soft); color: var(--green); }
  .sheetmenu .danger { color: var(--danger); }
  .sheetmenu .cancel { background: none; color: var(--muted); }
  .group { padding: 10px 14px 4px; font: 700 12px var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; background: var(--panel); position: sticky; top: 0; }
  .item { padding: 7px 8px 7px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .item .main { flex: 1; min-width: 0; }
  .item .mk { flex: none; display: grid; place-items: center; }
  .item .line1 { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  .item .name { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .gr { font: 13px var(--mono); flex: none; white-space: nowrap; }
  .item .meta { color: var(--muted); font-size: 12px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .ic { border: 0; background: none; padding: 8px; flex: none; display: grid; place-items: center; }
  .item .ic svg { width: 21px; height: 21px; }
  .item .go { color: var(--green); }

  .empty { padding: 40px 24px; color: var(--muted); text-align: center; line-height: 1.5; }
  .drawer footer { display: flex; gap: 8px; padding: 12px 16px calc(var(--safe-b) + 12px); border-top: 1px solid var(--line); }
  .credit { margin: 0; padding: 8px 16px 0; color: var(--muted); font-size: 12px; text-align: center; }
  .backup { margin: 0; padding: 4px 16px 0; color: var(--muted); font-size: 12px; line-height: 1.4; text-align: center; }
  .backup:empty { display: none; }
  .drawer footer button { flex: 1; border: 0; border-radius: 12px; padding: 13px; font: 600 15px var(--sans); background: var(--green-soft); color: var(--green); }

  /* Aa: a big, simple readout. Just the location, centred; everything else hidden. */
  /* the bar stays where it is (only Aa visible), so Aa is in exactly the same place to get back */
  body.large .actions > :not(#textBtn) { visibility: hidden; }
  body.large .sheet.compact .more { display: flex; }
  body.large #w3wRow, body.large .meta { display: none !important; }
  body.large .refline { flex-direction: column; gap: 8px; margin-top: 6px; }
  body.large .refline .big { justify-content: center; width: 100%; }
  body.large .ref { text-align: center; flex: none; }
  body.large .refline .prec { flex-direction: row; }
  body.large .rows { border-top: 0; }
  body.large .row { flex-direction: column; align-items: center; gap: 0; padding: 6px 8px; border-bottom: 0; }
  body.large .row .k { width: auto; text-align: center; font-size: 13px; }
  body.large .row .v { flex: none; text-align: center; font-size: clamp(22px, 7vw, 30px) !important; }
  /* Large text: for small phones and tired eyes in the field */
  /* the grid ref itself is the copy button here, so the digits get the full width */
  body.large .c svg { width: 22px; height: 22px; }
  body.large .row .v.dim { font-size: 18px; }
  body.large .prec button { font-size: 16px; padding: 8px 11px; }
  body.large .from-me { font-size: 17px; }
  body.large .search input { font-size: 18px; }
  body.large .results button { font-size: 18px; padding: 15px 14px; }
  body.large .results button small { font-size: 14px; }
  body.large .fab { width: 56px; height: 56px; }
  body.large .fab svg { width: 28px; height: 28px; }
  body.large .item .name { font-size: 18px; }
  body.large .item .gr { font-size: 16px; }
  body.large .layers button { font-size: 18px; padding: 12px 16px; }

  /* navigate: the map shows you, the flag and the line; the panel is the compass */
  .nav { display: none; }
  body.navigating .sheet > :not(.nav) { display: none; }
  .measure { display: none; }
  body.measuring .sheet > :not(.measure) { display: none; }
  body.measuring .measure { display: block; }
  .m-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .m-nums small { display: block; font: 600 12px var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .m-nums b { font: 700 clamp(24px, 8vw, 32px)/1.15 var(--mono); }
  .m-nums { margin-bottom: 8px; }
  body.measuring:not(.area-mode) .m-area { display: none; }
  body.measuring:not(.area-mode) .m-nums { grid-template-columns: 1fr; }
  body.area-mode .m-len { display: none; }
  .m-btns { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 6px; }
  .m-btns button { border: 0; border-radius: 12px; padding: 10px 4px; font: 600 14px var(--sans); background: var(--green-soft); color: var(--green); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .m-btns button svg { width: 22px; height: 22px; }
  .m-btns .primary { background: var(--green); color: var(--panel); }
  body.large .m-btns button { font-size: 16px; }
  body.navigating .nav { display: block; }
  body.navigating .cross { display: none; }
  .nav-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .nav-head small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .nav-head b { font: 700 22px var(--mono); }
  .nav-head button { border: 0; border-radius: 12px; padding: 10px 18px; font: 600 16px var(--sans); background: var(--green-soft); color: var(--green); }
  .nav-body { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
  .dial { width: min(30vw, 120px); height: min(30vw, 120px); flex: none; }
  .dial .ring { fill: var(--green-soft); stroke: var(--line); stroke-width: 2; }
  .dial .tick { stroke: var(--muted); stroke-width: 3; }
  .dial text { fill: var(--muted); font: 700 18px var(--sans); text-anchor: middle; }
  .dial text.n { fill: #c0392b; font-size: 22px; }
  .dial .arrow { fill: var(--green); stroke: var(--panel); stroke-width: 3; stroke-linejoin: round; }
  .dial.here .arrow { fill: #c0392b; }
  .dial.unsure .arrow { fill: var(--muted); opacity: .45; }
  #rose, #arrow { will-change: transform; }
  .nav-nums { flex: 1; min-width: 0; font-size: 16px; line-height: 1.5; }
  .nav-nums .dist { font: 700 clamp(30px, 10vw, 44px)/1.1 var(--mono); }
  .nav-nums .dim { color: var(--muted); font-size: 13px; }
  .nav-nums .head { font: 700 clamp(20px, 6.4vw, 26px)/1.2 var(--sans); color: var(--green); }
  .nav-nums .deg { font: 600 16px var(--mono); }
  .nav-hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  body.large .nav-head b { font-size: 26px; }
  body.large .dial { width: min(34vw, 140px); height: min(34vw, 140px); }
  body.large .nav-nums { font-size: 19px; }
  body.large .nav-nums .dist { font-size: clamp(36px, 12vw, 54px); }
  .flag { font-size: 30px; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }

  /* search results: every answer shown as a grid ref */
  .results button .gr { display: block; font: 700 19px var(--mono); }
  body.large .results button .gr { font-size: 23px; }

  /* no visible scrollbars anywhere: lists still scroll with a finger */
  .rows, .results, .list, .layers { scrollbar-width: none; }
  .rows::-webkit-scrollbar, .results::-webkit-scrollbar, .list::-webkit-scrollbar, .layers::-webkit-scrollbar { display: none; }

  /* save popup */
  .modal { position: fixed; inset: 0; z-index: 1300; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center; padding: calc(var(--safe-t) + 14px) 12px 12px; }
  .modal[hidden] { display: none; }
  .card { width: 100%; max-width: 420px; background: var(--panel); border-radius: 16px; padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 10px; }
  .card label { display: flex; flex-direction: column; gap: 4px; font: 600 14px var(--sans); color: var(--muted); }
  .card input, .card textarea { font: 16px var(--sans); color: var(--ink); background: var(--green-soft); border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: none; }
  .kind { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .kind[hidden] { display: none; }
  .kind button { border: 2px solid var(--line); border-radius: 10px; padding: 9px; font: 600 15px var(--sans); background: var(--panel); color: var(--ink); }
  .kind button.on { border-color: var(--green); background: var(--green-soft); color: var(--green); }
  .pick[hidden] { display: none; }
  .pick { display: flex; gap: 6px; }
  .pick button { flex: 1 1 0; min-width: 0; max-width: 44px; aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; padding: 0; }
  .pick button.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--panel) inset; }
  .pick svg { width: 24px; height: 24px; }
  .card .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card .btns button { border: 0; border-radius: 12px; padding: 13px; font: 600 16px var(--sans); background: var(--green-soft); color: var(--green); }
  .card .btns .primary { background: var(--green); color: var(--panel); }
  .w3wcard { height: calc(100% - 10px); padding: 8px; }
  .w3wcard iframe { flex: 1; width: 100%; border: 0; border-radius: 10px; background: #fff; }
  .w3wnote { margin: 0; color: var(--muted); font-size: 12.5px; text-align: center; }
  .card .btns.one { grid-template-columns: 1fr; }
  .btnlink { display: grid; place-items: center; border-radius: 12px; padding: 13px; font: 600 16px var(--sans); text-decoration: none; background: var(--green); color: var(--panel); }
  .pin { filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); }

  /* install nudge, iPhone only, until it's installed */
  .install { position: fixed; z-index: 1150; left: 12px; right: 12px; top: calc(var(--safe-t) + 64px); background: var(--ink); color: var(--panel); border-radius: 14px; padding: 12px 40px 12px 14px; font: 14px/1.4 var(--sans); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  .install[hidden] { display: none; }
  .install b { display: block; font-size: 15px; margin-bottom: 2px; }
  .instlink { color: #9fd4ab; font-weight: 700; white-space: nowrap; }
  .install button { position: absolute; top: 6px; right: 6px; border: 0; background: none; color: var(--panel); font-size: 18px; padding: 6px 10px; }
  .toast { position: fixed; z-index: 1200; left: 50%; top: calc(var(--safe-t) + 70px); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 12px 18px; border-radius: 22px; font: 600 16px var(--sans); opacity: 0; transition: opacity .2s; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); text-align: center; line-height: 1.3; }
  .toast.show { opacity: 1; }

  .leaflet-control-attribution { font-size: 9px; }
  .leaflet-bottom { bottom: var(--sheet-h, 230px); }
  .grid-label { color: #1d4f8f; font: 600 11px var(--mono); text-shadow: 0 0 3px #fff, 0 0 3px #fff; white-space: nowrap; }
  .layers { position: fixed; z-index: 1001; right: 76px; max-height: calc(100% - 80px); overflow-y: auto; background: var(--panel); border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.22); display: none; }
  .layers button { display: block; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); font: 15px var(--sans); padding: 10px 14px; text-align: left; white-space: nowrap; }
  .layers button.tick { border-top: 1px solid var(--line); }
  .lidar { mix-blend-mode: multiply; }
  .layers button.ver { color: var(--muted); font-size: 10px; padding: 6px 14px; border-bottom: 0; }
  .layers button.on { color: var(--green); font-weight: 700; }
</style>
</head>
<body>

</div>
<div class="toast" id="toast"></div>
<!-- Tapping this switch's label gives a haptic tick on iPhone (iOS 18+); there's no vibrate API there -->
<input type="checkbox" switch id="hapticSw" tabindex="-1" aria-hidden="true" style="position:fixed;left:-99px;top:0;opacity:0">

<script src="vendor/leaflet/leaflet.js?v=37"></script>
<script src="config.js?v=37"></script>
<script src="osgb.js?v=37"></script>
<script src="parse.js?v=37"></script>
<script src="local.js?v=37"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("gridref." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("gridref." + k, JSON.stringify(v)); return true; } catch { return false; } },
  };

  // ---------- map ----------
  const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
  const LAYERS = {
    aerial: { name: "Aerial photo", layer: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Imagery © Esri, Maxar, Earthstar Geographics" }) },
    topo: { name: "Topo", layer: L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", { maxZoom: 17, subdomains: "abc", crossOrigin: true, attribution: "© OpenStreetMap, SRTM | © OpenTopoMap (CC-BY-SA)" }) },
    os: { name: "OS map", layer: L.tileLayer("maps/{z}/{x}/{y}.webp", { minZoom: 10, maxNativeZoom: 17, maxZoom: 19, errorTileUrl: BLANK }) },
  };
  const start = store.get("view", { lat: 54.25, lon: -2.95, z: 11 });
  const map = L.map("map", { zoomControl: false, attributionControl: true, tap: false }).setView([start.lat, start.lon], start.z);
  map.attributionControl.addAttribution("OS data © Crown copyright 2026");
  let current = LAYERS[store.get("layer", "topo")] ? store.get("layer", "topo") : "topo"; // Topo by default
  LAYERS[current].layer.addTo(map);
  function setBase(k) {
    if (k === current) return;
    map.removeLayer(LAYERS[current].layer);
    current = k;
    LAYERS[k].layer.addTo(map);
    if (offlineOverlay && map.hasLayer(offlineOverlay)) offlineOverlay.bringToFront();
  }

  let large = store.get("large", false);
  function keepTarget(change) {
    const t = target();
    change();
    layout();
    panTo(t, map.getZoom(), false);
    fitRef();
    update();
  }
  function setLarge(on) {
    keepTarget(() => {
      large = on;
      store.set("large", on);
      document.body.classList.toggle("large", on);
    });
  }
  document.body.classList.toggle("large", large);
  $("textBtn").classList.toggle("on", large);
  $("textBtn").onclick = () => { setLarge(!large); $("textBtn").classList.toggle("on", large); toast(large ? "Large text" : "Normal text"); };

  const VERSION = "37"; // bump with each release so a phone can show which copy it's running
  const layersEl = $("layers");
  // LiDAR shading: the Environment Agency's 1 m ground model, blended over whichever map is
  // showing. Its own pane sits above the maps, so switching map never covers it.
  map.createPane("shade").style.zIndex = 250;
  const lidarShade = L.tileLayer.wms("https://environment.data.gov.uk/spatialdata/lidar-composite-digital-terrain-model-dtm-1m/wms", {
    layers: "Lidar_Composite_Hillshade_DTM_1m", format: "image/png", transparent: true, opacity: 0.55, maxZoom: 19, pane: "shade", className: "lidar", attribution: "LiDAR © Environment Agency" });
  let shadeOn = store.get("shade", (store.get("overlays", []) || []).includes("lidar"));
  function setShade(on) {
    shadeOn = on;
    store.set("shade", on);
    if (on) lidarShade.addTo(map); else map.removeLayer(lidarShade);
  }
  function drawLayerMenu() {
    layersEl.innerHTML = "";
    for (const [k, v] of Object.entries(LAYERS)) {
      const b = document.createElement("button");
      b.textContent = (k === current ? "● " : "○ ") + v.name;
      b.className = k === current ? "on" : "";
      b.onclick = () => {
        setBase(k);
        store.set("layer", k);
        layersEl.style.display = "none";
      };
      layersEl.appendChild(b);
    }
    const sh = document.createElement("button");
    sh.textContent = (shadeOn ? "☑ " : "☐ ") + "LiDAR shading";
    sh.className = "tick" + (shadeOn ? " on" : "");
    sh.onclick = () => { setShade(!shadeOn); drawLayerMenu(); placeLayerMenu(); };
    layersEl.appendChild(sh);
    if (pack.state === "failed") {
      const off = document.createElement("button");
      off.textContent = "Offline maps paused: tap to retry";
      off.onclick = () => { layersEl.style.display = "none"; downloadPack(); };
      layersEl.appendChild(off);
    }
    const ver = document.createElement("button");
    ver.textContent = "Nick Sykes for Natural England · v" + VERSION;
    ver.disabled = true;
    ver.className = "ver";
    layersEl.appendChild(ver);
  }
  // Open beside the layers button, bottom edges lined up, never off the top of the screen
  function placeLayerMenu() {
    const r = $("layersBtn").getBoundingClientRect();
    layersEl.style.right = window.innerWidth - r.left + 8 + "px";
    layersEl.style.top = "auto";
    layersEl.style.bottom = Math.max(8, window.innerHeight - r.bottom) + "px";
    const top = layersEl.getBoundingClientRect().top, minTop = 64;
    if (top < minTop) { layersEl.style.bottom = "auto"; layersEl.style.top = minTop + "px"; }
  }
  $("layersBtn").onclick = () => {
    const open = layersEl.style.display === "block";
    if (!open) drawLayerMenu();
    layersEl.style.display = open ? "none" : "block";
    if (!open) placeLayerMenu();
  };
  if (shadeOn) setShade(true);

  // Keep the crosshair in the middle of the visible map (above the sheet)
  const sheet = $("sheet");
  function layout() {
    const h = sheet.offsetHeight;
    document.documentElement.style.setProperty("--sheet-h", h + "px");
    document.documentElement.style.setProperty("--cross-y", (window.innerHeight - h) / 2 + "px");
  }
  // The point under the crosshair, not the map's geometric centre
  function target() {
    const size = map.getSize();
    return map.containerPointToLatLng([size.x / 2, (window.innerHeight - sheet.offsetHeight) / 2]);
  }
  function panTo(latlng, zoom, animate = true) {
    const z = Math.min(zoom || map.getZoom(), map.getMaxZoom());
    const offsetY = (window.innerHeight - (window.innerHeight - sheet.offsetHeight) / 2) - window.innerHeight / 2;
    const p = map.project(latlng, z).add([0, offsetY]);
    map.setView(map.unproject(p, z), z, { animate });
  }

  // ---------- OS grid overlay ----------
  const gridLayer = L.layerGroup().addTo(map);
  function drawGrid() {
    gridLayer.clearLayers();
    const z = map.getZoom();
    const step = z >= 13 ? 1000 : z >= 10 ? 10000 : 100000;
    const b = map.getBounds();
    const corners = [b.getSouthWest(), b.getNorthWest(), b.getNorthEast(), b.getSouthEast()].map((c) => OSGB.wgs84ToGrid(c.lat, c.lng));
    const minE = Math.max(0, Math.floor(Math.min(...corners.map((c) => c.e)) / step) * step);
    const maxE = Math.min(700000, Math.ceil(Math.max(...corners.map((c) => c.e)) / step) * step);
    const minN = Math.max(0, Math.floor(Math.min(...corners.map((c) => c.n)) / step) * step);
    const maxN = Math.min(1300000, Math.ceil(Math.max(...corners.map((c) => c.n)) / step) * step);
    if ((maxE - minE) / step > 80 || (maxN - minN) / step > 80) return;
    const style = { color: "#1d4f8f", weight: step === 100000 ? 2 : 1, opacity: 0.55, interactive: false };
    const seg = 8;
    for (let e = minE; e <= maxE; e += step) {
      const pts = [];
      for (let i = 0; i <= seg; i++) { const ll = OSGB.gridToWgs84(e, minN + ((maxN - minN) * i) / seg); pts.push([ll.lat, ll.lon]); }
      L.polyline(pts, style).addTo(gridLayer);
    }
    for (let n = minN; n <= maxN; n += step) {
      const pts = [];
      for (let i = 0; i <= seg; i++) { const ll = OSGB.gridToWgs84(minE + ((maxE - minE) * i) / seg, n); pts.push([ll.lat, ll.lon]); }
      L.polyline(pts, style).addTo(gridLayer);
    }
    // Label the 1 km / 10 km lines along the top and left edges of the screen
    if (step <= 10000) {
      const div = step === 1000 ? 1000 : 10000;
      const digits = step === 1000 ? 2 : 1;
      const top = map.getBounds().getNorth(), left = map.getBounds().getWest();
      for (let e = minE + step; e < maxE; e += step) {
        const ll = OSGB.gridToWgs84(e + step * 0.04, OSGB.wgs84ToGrid(top, map.getCenter().lng).n - step * 0.0);
        const txt = String(Math.floor((e % 100000) / div)).padStart(digits, "0");
        L.marker([top, ll.lon], { interactive: false, icon: L.divIcon({ className: "grid-label", html: txt, iconSize: null, iconAnchor: [-2, -74] }) }).addTo(gridLayer);
      }
      for (let n = minN + step; n < maxN; n += step) {
        const ll = OSGB.gridToWgs84(OSGB.wgs84ToGrid(map.getCenter().lat, left).e, n);
        const txt = String(Math.floor((n % 100000) / div)).padStart(digits, "0");
        L.marker([ll.lat, left], { interactive: false, icon: L.divIcon({ className: "grid-label", html: txt, iconSize: null, iconAnchor: [-4, 14] }) }).addTo(gridLayer);
      }
    }
  }

  // ---------- readout ----------
  // 6 or 8 figures only: phone GPS (~5 m in the open, worse under trees) plus the ~3-5 m
  // datum shift can't support a 10-figure (1 m) ref. 10-figure refs can still be searched.
  let digits = store.get("digits", 8) === 6 ? 6 : 8;
  let here = null; // { lat, lon, acc }
  function setPrec(d) {
    digits = d;
    store.set("digits", d);
    for (const b of $("prec").children) b.classList.toggle("on", +b.dataset.d === d);
    update();
  }
  for (const b of $("prec").children) b.onclick = () => setPrec(+b.dataset.d);

  function info(latlng) {
    const g = OSGB.wgs84ToGrid(latlng.lat, latlng.lng);
    return { lat: latlng.lat, lon: latlng.lng, e: g.e, n: g.n, ref: OSGB.gridRef(g.e, g.n, digits) };
  }

  function bearing(a, b) {
    const φ1 = a.lat * Math.PI / 180, φ2 = b.lat * Math.PI / 180, Δλ = (b.lng - a.lng) * Math.PI / 180;
    const y = Math.sin(Δλ) * Math.cos(φ2), x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }
  const POINTS = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
  const POINT_NAMES = ["North", "North-east", "East", "South-east", "South", "South-west", "West", "North-west"];
  const fmtBrg = (b) => `${POINTS[Math.round(b / 45) % 8]} (${String(Math.round(b) % 360).padStart(3, "0")}°)`;
  function fmtDist(m) { return m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(m < 10000 ? 2 : 1) + " km"; }

  // Monospace digits are ~0.6em wide: size the ref to the room beside the 6/8 switch
  function fitRef() {
    const ref = $("ref");
    if (ref.classList.contains("off")) { ref.style.fontSize = ""; return; }
    const room = ref.parentElement.clientWidth - 20; // less the 8 px padding each side
    ref.style.fontSize = Math.max(20, Math.min(large ? 72 : 38, room / (ref.textContent.length * 0.62))) + "px";
  }

  let last = null;
  function update() {
    const t = following && here ? L.latLng(here.lat, here.lon) : target();
    const p = info(t);
    p.en = `${Math.round(p.e)}, ${Math.round(p.n)}`;
    p.ll = `${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`;
    last = p;
    const ref = $("ref");
    if (ref.textContent !== (p.ref || "Outside the GB grid")) {
      ref.textContent = p.ref || "Outside the GB grid";
      ref.classList.toggle("off", !p.ref);
      fitRef();
    }
    $("vEN").textContent = p.ref ? p.en : "—";
    $("vLL").textContent = p.ll;

  function parseCSV(text) {

    text() {
      if (this.state === "ready") return `✓ Offline maps ready (${this.reserves} reserves)`;
      if (this.state === "downloading") return `Offline maps downloading: ${Math.round((this.done / (this.total || 1)) * 100)}% of ${this.mb} MB`;
      if (this.state === "failed") return "Offline maps paused. Tap to retry";
      return "Offline maps: waiting for signal";
    },
  };
  async function downloadPack() {
    if (!("caches" in window) || pack.state === "downloading") return;
    let idx;
    try { idx = await (await fetch("maps/index.json", { cache: "no-cache" })).json(); } catch { pack.state = "failed"; return; }
    pack.reserves = idx.reserves.length;
    pack.mb = Math.round(idx.bytes / 1e6);
    if (store.get("pack", "") === idx.version) { pack.state = "ready"; return; }
    const cache = await caches.open("gridref-maps");
    const missing = async () => {
      const have = new Set((await cache.keys()).map((r) => new URL(r.url).pathname.split("/maps/")[1]));
      return idx.tiles.filter((t) => !have.has(t));
    };
    let todo = await missing();
    pack.total = idx.tiles.length;
    pack.done = pack.total - todo.length;
    pack.state = "downloading";
    if (todo.length > 50) toast(`Downloading offline maps (${pack.mb} MB)`);
    // A few requests can fail in a rush or on patchy signal: go round again for the gaps,
    // and only give up if a whole pass gets nothing (no signal)
    for (let pass = 0; pass < 5 && todo.length; pass++) {
      let got = 0;
      const queue = todo.slice();
      const worker = async () => {
        while (queue.length) {
          const t = queue.shift();
          try {
            const r = await fetch("maps/" + t);
            if (r.ok) { await cache.put("maps/" + t, r); pack.done++; got++; }
          } catch {}
        }
      };
      await Promise.all(Array.from({ length: 14 }, worker)); // GitHub serves over HTTP/2, so many at once is fine
      todo = await missing();
      pack.done = pack.total - todo.length;
      if (!got) break;
    }
    if (todo.length) { pack.state = "failed"; return; }
    // Tiles from reserves taken out of the pack: free the space
    const keep = new Set(idx.tiles);
    for (const r of await cache.keys()) { const t = new URL(r.url).pathname.split("/maps/")[1]; if (t !== "index.json" && !keep.has(t)) cache.delete(r); }
    store.set("pack", idx.version);
    pack.state = "ready";
    toast("✓ Offline maps ready");
  }

  // No signal: lay the OS map over whatever map is showing (aerial photos can't be kept,
  // so that switches to the topo map underneath). Signal back: put it all back.
  let offlineMode = false, swappedFrom = null, tileErrors = [], probe = null;
  function goOffline() {
    if (offlineMode) return;
    offlineMode = true;
    if (current === "aerial") { swappedFrom = "aerial"; setBase("topo"); }
    if (current !== "os") offlineOverlay.addTo(map);
    toast("Switching to offline maps");
    clearInterval(probe);
    probe = setInterval(async () => {
      try { await fetch("version.json", { cache: "no-store" }); goOnline(); } catch {}
    }, 20000);
  }
  function goOnline() {
    if (!offlineMode) return;
    offlineMode = false;
    clearInterval(probe);
    map.removeLayer(offlineOverlay);
    if (swappedFrom) { setBase(swappedFrom); swappedFrom = null; }
    toast("Back online: normal maps");
    if (pack.state !== "ready") downloadPack();
  }
  // Phones often claim to be online with no usable signal, so also watch for map tiles
  // failing to load: several in a few seconds means no signal.
  for (const k of ["topo", "aerial"]) {
    LAYERS[k].layer.on("tileerror", () => {
      const now = Date.now();
      tileErrors = tileErrors.filter((t) => now - t < 6000).concat(now);
      if (tileErrors.length >= 4) goOffline();
    });
  }
  window.addEventListener("offline", goOffline);
  window.addEventListener("online", goOnline);

  // ---------- reserve boundaries (Natural England, live when there's signal) ----------
  const NNR_LIVE = "https://services.arcgis.com/JJzESW51TqeY9uat/arcgis/rest/services/National_Nature_Reserves_England/FeatureServer/0/query?where=1%3D1&geometry=290000,440000,400000,600000&geometryType=esriGeometryEnvelope&inSR=27700&spatialRel=esriSpatialRelIntersects&outFields=NAME,LABEL,REF_CODE,MEASURE&outSR=4326&geometryPrecision=5&maxAllowableOffset=0.00003&f=geojson";
  const nnrLayer = L.geoJSON(null, { interactive: false, style: { color: "#0b7a3b", weight: 2.5, opacity: 0.85, dashArray: "8 5", fillColor: "#0b7a3b", fillOpacity: 0.05 } }).addTo(map);
  let nnr = [];
  function inRing(x, y, ring) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  function reserveAt(ll) {
    for (const f of nnr) {
      const [w, s2, e, n] = f.bbox;
      if (ll.lng < w || ll.lng > e || ll.lat < s2 || ll.lat > n) continue;
      const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
      for (const poly of polys) {
        if (inRing(ll.lng, ll.lat, poly[0]) && !poly.slice(1).some((h) => inRing(ll.lng, ll.lat, h))) return f.properties.LABEL;
      }
    }
    return "";
  }
  function useNNR(gj) {
    if (!gj || !gj.features || !gj.features.length) return false;
    nnr = gj.features.map((f) => {
      const b = L.geoJSON(f).getBounds();
      return { ...f, bbox: [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()] };
    });
    nnrLayer.clearLayers().addData(gj);
    update();
    return true;
  }
  async function loadNNR() {
    // Live from Natural England first (always current); the copy shipped with the app if not
    try { if (useNNR(await (await fetch(NNR_LIVE)).json())) return; } catch {}
    try { useNNR(await (await fetch("data/nnr.geojson")).json()); } catch {}
  }
  map.attributionControl.addAttribution("Reserve boundaries © Natural England");

  // ---------- measure: points at the crosshair (or GPS), distance and area ----------
  // Area is worked out on the OS grid (flat metres), which is what a ranger would measure on a map.
  let measure = null, mLine = null, mLive = null, mDots = null;
  function mStats(pts) {
    let d = 0;
    for (let i = 1; i < pts.length; i++) d += pts[i - 1].distanceTo(pts[i]);
    let area = null;
    if (pts.length >= 3) {
      const g = pts.map((p) => OSGB.wgs84ToGrid(p.lat, p.lng));
      let a = 0;
      for (let i = 0; i < g.length; i++) { const j = (i + 1) % g.length; a += g[i].e * g[j].n - g[j].e * g[i].n; }
      area = Math.abs(a) / 2;
    }
    return { d, area };
  }
  const fmtArea = (m2) => `${(m2 / 10000).toFixed(m2 < 100000 ? 2 : 1)} ha (${Math.round(m2).toLocaleString("en-GB")} m²)`;
  // Two tools: the ruler measures a line (walls, fences, hedges), the area tool measures an
  // area (bracken, scrub). Numbers are for the points added; the dotted line is the next one.
  function drawMeasure() {
    if (!measure) return;
    const pts = measure.pts, t = target(), isArea = measure.kind === "area";
    mLine.setLatLngs(isArea && pts.length >= 3 ? pts.concat([pts[0]]) : pts);
    mLive.setLatLngs(pts.length ? [pts[pts.length - 1], t] : []);
    mDots.clearLayers();
    pts.forEach((p) => L.circleMarker(p, { radius: 5, color: "#fff", weight: 2, fillColor: "#c0392b", fillOpacity: 1, interactive: false }).addTo(mDots));
    const st = mStats(isArea && pts.length >= 3 ? pts.concat([pts[0]]) : pts);
    $("mDist").textContent = fmtDist(st.d);
    const a = isArea && pts.length >= 3 ? mStats(pts).area : null;
    $("mArea").textContent = a != null ? `${Math.round(a).toLocaleString("en-GB")} m²` : "—";
    $("mHa").textContent = a != null ? `${(a / 10000).toFixed(a < 100000 ? 2 : 1)} ha` : "—";
  }
  function startMeasure(kind) {
    measure = { kind, pts: [] };
    mLine = L.polyline([], { color: "#c0392b", weight: 3, interactive: false }).addTo(map);
    mLive = L.polyline([], { color: "#c0392b", weight: 2, dashArray: "4 6", interactive: false }).addTo(map);
    mDots = L.layerGroup().addTo(map);
    document.body.classList.toggle("area-mode", kind === "area");
    document.body.classList.add("measuring");
    keepTarget(() => {});
    drawMeasure();
  }
  $("measureBtn").onclick = () => startMeasure("line");
  $("areaBtn").onclick = () => startMeasure("area");
  $("mAdd").onclick = () => { measure.pts.push(target()); drawMeasure(); };
  $("mUndo").onclick = () => { measure.pts.pop(); drawMeasure(); };
  $("mSave").onclick = () => {
    const pts = measure.pts, isArea = measure.kind === "area";
    if (pts.length < (isArea ? 3 : 2)) return toast(isArea ? "Add at least 3 corners" : "Add at least 2 points");
    const st = mStats(pts), first = OSGB.wgs84ToGrid(pts[0].lat, pts[0].lng);
    openSave({
      kind: measure.kind,
      pts: pts.map((q) => [+q.lat.toFixed(6), +q.lng.toFixed(6)]),
      lat: pts[0].lat, lon: pts[0].lng, e: Math.round(first.e), n: Math.round(first.n),
      length: Math.round(st.d), area: isArea ? Math.round(st.area) : null, acc: null,
    });
  };
  $("mDone").onclick = () => {
    measure = null;
    for (const l of [mLine, mLive, mDots]) map.removeLayer(l);
    keepTarget(() => document.body.classList.remove("measuring", "area-mode"));
  };
  for (const id of ["mDist", "mArea", "mHa"]) $(id).parentElement.onclick = () => { const v = $(id).textContent; if (v !== "—") copy(v); };
  map.on("move", () => { if (measure) drawMeasure(); });

  // ---------- photo with the grid ref stamped on ----------
  // Uses your GPS position if the blue dot is on, otherwise the crosshair.
  $("photoBtn").onclick = () => $("photoIn").click();
  $("photoIn").onchange = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    toast("Stamping the photo…");
    const where = here ? { lat: here.lat, lon: here.lon, src: `GPS ±${Math.round(here.acc)} m` } : { lat: last.lat, lon: last.lon, src: "Crosshair" };
    const g = OSGB.wgs84ToGrid(where.lat, where.lon);
    const ref = OSGB.gridRef(g.e, g.n, digits) || `${where.lat.toFixed(5)}, ${where.lon.toFixed(5)}`;
    const when = new Date();
    const reserve = nnr.length ? reserveAt(L.latLng(where.lat, where.lon)) : "";
    const img = new Image();
    img.src = URL.createObjectURL(file);
    try { await img.decode(); } catch { return toast("Couldn't read that photo"); }
    // Big phone photos are scaled to 2400 px on the long side: plenty, and quick to share
    const k = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k);
    c.height = Math.round(img.naturalHeight * k);
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    const u = Math.round(c.width / 28); // text size scales with the photo
    const lines = [
      { t: ref, f: `700 ${Math.round(u * 1.5)}px ui-monospace, Menlo, monospace` },
      { t: `${when.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })} ${when.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })} · ${where.src}`, f: `600 ${u}px -apple-system, sans-serif` },
    ];
    if (reserve) lines.push({ t: reserve, f: `600 ${u}px -apple-system, sans-serif` });
    const pad = Math.round(u * 0.7), lh = (l) => parseInt(l.f.match(/(\d+)px/)[1]) * 1.3;
    const boxH = lines.reduce((h, l) => h + lh(l), 0) + pad * 2;
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(0, c.height - boxH, c.width, boxH);
    ctx.fillStyle = "#fff";
    ctx.textBaseline = "top";
    let y = c.height - boxH + pad;
    for (const l of lines) { ctx.font = l.f; ctx.fillText(l.t, pad, y); y += lh(l); }
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.88));
    const pad2 = (v) => String(v).padStart(2, "0");
    const stamp = `${when.getFullYear()}${pad2(when.getMonth() + 1)}${pad2(when.getDate())}_${pad2(when.getHours())}${pad2(when.getMinutes())}`; // local time
    const name = `${ref.replace(/\s+/g, "")}_${stamp}.jpg`;
    const out = new File([blob], name, { type: "image/jpeg" });
    // Sharing needs a fresh tap (the camera one has expired by now), so show it with a button.
    // On iPhone the share sheet has "Save Image" for the Photos library.
    photoFile = out;
    photoText = `${ref} · ${when.toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })}${reserve ? " · " + reserve : ""}`;
    $("photoOut").src = URL.createObjectURL(out);
    $("photoModal").hidden = false;
  };
  let photoFile = null, photoText = "";
  $("photoShare").onclick = async () => {
    if (!photoFile) return;
    if (navigator.canShare && navigator.canShare({ files: [photoFile] })) {
      try { await navigator.share({ files: [photoFile], text: photoText }); } catch {}
    } else {
      const a = document.createElement("a");
      a.href = $("photoOut").src;
      a.download = photoFile.name;
      a.click();
    }
  };
  $("photoClose").onclick = () => { $("photoModal").hidden = true; URL.revokeObjectURL($("photoOut").src); photoFile = null; };

  // ---------- install nudge ----------
  // Offline maps and saved points only work properly from the Home Screen icon, and only
  // Safari can add one on iPhone. So: in Edge/Chrome, say "open in Safari"; in Safari, say
  // how to add it. Never shown once installed; dismissing hides it for a fortnight.
  (function installNudge() {
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const installed = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
    const snoozed = Date.now() - store.get("instSnooze", 0) < 14 * 86400000;
    if (!ios || installed || snoozed) return;
    const otherBrowser = /CriOS|EdgiOS|FxiOS|OPiOS|GSA\//.test(navigator.userAgent);
    $("instText").textContent = otherBrowser
      ? "Open this page in Safari to install it. Offline maps and your saved points need the Safari version."
      : "Tap the Share button, then “Add to Home Screen”. Always open it from that icon: it works offline and keeps your saved points.";
    $("install").hidden = false;
    $("instClose").onclick = () => { $("install").hidden = true; store.set("instSnooze", Date.now()); };
  })();

  // ---------- go ----------
  window.addEventListener("resize", () => { layout(); fitRef(); update(); });
  for (const step of [() => setPrec(digits), drawPins, drawGrid, loadNNR, () => { if (!navigator.onLine) goOffline(); }]) {
    try { step(); } catch (e) { console.error(e); }
  }
  setTimeout(() => { if (navigator.onLine) downloadPack(); }, 4000);
  layout();
  update();
  // Any browser (Edge and Chrome on iPhone have no service worker): ask GitHub which
  // version is current and, if this page is older, load the new one. The ?v= makes the
  // browser fetch a fresh page instead of reusing its cached copy.
  async function checkVersion() {
    try {
      const j = await (await fetch("version.json", { cache: "no-store" })).json();
      if (j.v && j.v !== VERSION && !location.search.includes("v=" + j.v)) location.replace(location.pathname + "?v=" + j.v);
    } catch {}
  }
  checkVersion();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkVersion(); });

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (hadController && !reloaded) { reloaded = true; location.reload(); }
    });
    navigator.serviceWorker.register("sw.js").then((r) => r.update()).catch(() => {});
    // Check for a new version whenever the app comes back to the front
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
    });
  }
})();
</script>
</body>
</html>
