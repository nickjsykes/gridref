<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Field Notes</title>
<meta name="description" content="Find and share Ordnance Survey grid references on your phone.">
<meta name="theme-color" content="#2e6560">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field Notes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=127">
<link rel="stylesheet" href="app.css?v=127">
</head>
<body>
<div id="map"></div>
<div class="cross" aria-hidden="true"></div>

<div class="top">
  <form class="search" id="searchForm" autocomplete="off">
    <input id="q" type="search" enterkeyhint="search" placeholder="Grid ref, postcode or place" aria-label="Search">
    <button type="submit">Go</button>
  </form>
</div>
<div class="chips" id="chips"></div>
<div class="rescard" id="resCard" hidden></div>
<div class="results" id="results"></div>

<div class="fabs">
  <div class="pill">
  <button class="fab" id="locBtn" aria-label="Show my location"><span class="acc" id="accBadge" hidden></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.5 3.5 3 11l7.6 2.4L13 21Z"/></svg>
  </button>
  <button class="fab" id="layersBtn" aria-label="Map style">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg>
  </button>
  </div>
</div>
<div class="fabs left">
  <div class="addmenu" id="addMenu">
  <button class="fab" id="photoBtn" aria-label="Photo with grid ref"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  <input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
  <input type="file" id="photoPick" accept="image/*" hidden>
  <button class="fab" id="areaBtn" aria-label="Measure an area"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7 12 3l7 5-2 11H7Z" fill="currentColor" fill-opacity=".18"/><circle cx="5" cy="7" r="1.6" fill="currentColor"/><circle cx="12" cy="3" r="1.6" fill="currentColor"/><circle cx="19" cy="8" r="1.6" fill="currentColor"/><circle cx="17" cy="19" r="1.6" fill="currentColor"/><circle cx="7" cy="19" r="1.6" fill="currentColor"/></svg></button>
  <button class="fab" id="measureBtn" aria-label="Measure a line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 17 3l4 4L7 21Z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg></button>
  <button class="fab" id="saveBtn" aria-label="Add a point"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.3 7-12a7 7 0 0 0-14 0c0 5.7 7 12 7 12Z"/><circle cx="12" cy="10" r="2.6"/></svg></button>
  </div>
  <div class="pill">
  <button class="fab" id="listBtn" aria-label="Notebook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C9.5 4.6 6 4.3 3 5.3v13.4c3-1 6.5-.7 9 1.2 2.5-1.9 6-2.2 9-1.2V5.3c-3-1-6.5-.7-9 1.2Z"/><path d="M12 6.5v13.4"/></svg></button>
  <button class="fab addbtn" id="addBtn" aria-label="Add a point, line, area or photo" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</div>
<div class="layers" id="layers"></div>
<div class="layers featmenu" id="featMenu"></div>
<div class="layers photomenu" id="photoMenu"><button type="button" id="pmTake">Take a photo</button><button type="button" id="pmPick">Choose from phone</button></div>

<section class="sheet" id="sheet">
  <button class="grab" id="grab" aria-label="Show or hide details"><span></span><small class="more-hint">Lat/long · E/N · what3words</small></button>
  <div class="refline">
    <label class="big" for="hapticSw" data-copy="ref" aria-label="Copy grid reference"><span class="ref" id="ref">—</span></label>
  </div>
  <div class="more">
    <div class="meta">
      <span class="from-me" id="fromMe"></span>
    </div>
    <div class="rows">
      <label class="row" for="hapticSw" data-copy="ll"><span class="k">Lat / Long</span><span class="v" id="vLL"></span></label>
      <label class="row" for="hapticSw" data-copy="en"><span class="k">E / N</span><span class="v" id="vEN"></span></label>
      <a class="row" id="w3wRow" href="https://what3words.com/" target="_blank" rel="noopener"><span class="k">what3words</span><span class="v" id="vW3W"></span><span class="c" id="w3wAct"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><b>Open</b></span></a>
    </div>
  </div>
  <div class="actions">
    <button id="shareBtn" aria-label="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>Share</button>
    <button id="navBtn" aria-label="Navigate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z" fill="currentColor"/></svg>Navigate</button>
  <button class="aa" id="textBtn" aria-label="Text size"><svg viewBox="0 0 24 24" fill="currentColor"><text x="1" y="19" font-size="11" font-weight="700" font-family="-apple-system,sans-serif">A</text><text x="9" y="19" font-size="18" font-weight="700" font-family="-apple-system,sans-serif">A</text></svg></button>
  </div>
  <div class="measure" id="measure">
    <div class="m-nums">
      <div class="m-len"><small>Length</small><b id="mDist">0 m</b></div>
      <div class="m-area"><small>Square metres</small><b id="mArea">—</b></div>
      <div class="m-area"><small>Hectares</small><b id="mHa">—</b></div>
    </div>
    <div class="m-btns">
      <button class="primary" id="mAdd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add point</button>
      <button id="mUndo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Undo</button>
      <button id="mSave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5Z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>Save</button>
      <button id="mDone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>Done</button>
    </div>
  </div>
  <div class="movepanel" id="movePanel">
    <div class="im-title"><b id="mvTitle"></b><span id="mvInfo"></span></div>
    <p class="mvhint" id="mvHint"></p>
    <div class="btns"><button type="button" id="mvCancel">Cancel</button><button type="button" class="primary" id="mvGo">Place here</button></div>
  </div>
  <div class="nav" id="nav">
    <div class="nav-head">
      <div><small>Going to</small><b id="navRef"></b></div>
      <button id="navEnd">End</button>
    </div>
    <div class="nav-body">
      <svg class="dial" viewBox="-100 -100 200 200" aria-hidden="true">
        <g id="rose">
          <circle r="92" class="ring"/>
          <path d="M0-92v14M0 78v14M-92 0h14M78 0h14" class="tick"/>
          <text y="-60" class="n">N</text><text x="62" y="6">E</text><text y="72">S</text><text x="-62" y="6">W</text>
        </g>
        <g id="arrow"><path d="M0-70 26 30 0 14-26 30Z" class="arrow"/></g>
      </svg>
      <svg class="arrive" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44"/><path d="M29 52 44 66 72 36"/></svg>
      <div class="nav-nums">
        <div class="dist" id="navDist">—</div>
        <div class="head" id="navBrg"></div>
        <div class="deg" id="navDeg"></div>
        <div class="dim" id="navAcc"></div>
      </div>
    </div>
    <div class="nav-hint" id="navHint"></div>
  </div>
</section>

<div class="drawer" id="drawer">
  <header>
    <button class="back" id="folderBack" hidden aria-label="Back to the notebook">‹</button>
    <h2 class="dtitle"><span id="dTitle">Notebook</span> <small id="dSub">(on this phone only)</small></h2>
    <button id="closeDrawer">Done</button>
  </header>
  <div class="folderacts" id="folderActs" hidden><button type="button" id="folderMap">Show on map</button><button type="button" class="danger" id="folderDel">Delete folder</button></div>
  <div class="chiprow res" id="resFilter" hidden></div>
  <div class="list" id="list"></div>
  <p class="backup" id="backup"></p>
  <div class="selbar" id="selBar"><button type="button" id="selCancel">Cancel</button><button type="button" class="primary" id="selGo">Export 0</button></div>
  <footer>
    <button id="importBtn">Import</button>
    <button id="exportBtn">Export</button>
    <input type="file" id="importFile" accept=".csv,.zip,text/csv,text/plain,application/zip" hidden>
  </footer>
</div>

<div class="modal" id="saveModal" hidden>
  <form class="card" id="saveForm" autocomplete="off">
    <div class="kind" id="ptKind" hidden><button type="button" data-k="line">Line</button><button type="button" data-k="area">Area</button></div>
    <label>Name:<input id="ptName" enterkeyhint="next"></label>
    <label>Notes:<textarea id="ptNotes" rows="4"></textarea></label>
    <div class="pick" id="ptColour" aria-label="Colour"></div>
    <div class="pick" id="ptShape" aria-label="Shape"></div>
    <div class="edmove" id="ptMoveRow"><button type="button" id="ptMove">Move</button><button type="button" id="ptReshape">Reshape</button></div>
    <div class="btns"><button type="button" id="ptCancel">Cancel</button><button type="submit" class="primary">Save</button></div>
  </form>
</div>
<div class="modal" id="photoModal" hidden>
  <div class="card">
    <img id="photoOut" alt="Stamped photo" style="width:100%;border-radius:10px;display:block">
    <div class="chiprow stampopts" id="stampOpts" hidden></div>
    <input class="stampline" id="stampLine" placeholder="Message" maxlength="60" enterkeyhint="done" hidden>
    <div class="btns three"><button type="button" id="photoClose">Close</button><button type="button" id="photoShare">Share</button><button type="button" class="primary" id="photoSave">Save</button></div>
  </div>
</div>
<div class="modal" id="w3wModal" hidden>
  <div class="card w3wcard">
    <iframe id="w3wFrame" title="what3words" referrerpolicy="no-referrer"></iframe>
    <p class="w3wnote">Your lat/long is copied (not the 3 words yet). Paste it into the what3words search above to see the 3 words.</p>
    <div class="btns one"><button type="button" class="primary" id="w3wClose">Close</button></div>
  </div>
</div>
<div class="modal sheetmenu" id="itemMenu" hidden>
  <div class="card">
    <div class="im-title"><b id="imName"></b><span id="imRef"></span></div>
    <p class="im-notes" id="imNotes"></p>
    <button type="button" id="imView">View</button>
    <button type="button" id="imShow">Show on map</button>
    <button type="button" id="imNav">Navigate</button>
    <button type="button" id="imShare">Share</button>
    <button type="button" id="imEdit">Edit</button>
    <button type="button" id="imDel" class="danger">Delete</button>
    <button type="button" id="imCancel" class="cancel">Cancel</button>
  </div>
</div>
<div class="install" id="install" hidden>
  <b id="instTitle">Install Field Notes</b>
  <span id="instText"></span> <a href="install.html" class="instlink">Step by step ›</a>
  <button type="button" id="instClose" aria-label="Dismiss">✕</button>
</div>
<div class="modal sheetmenu" id="shareModal" hidden>
  <div class="card">
    <div class="im-title"><b>Share</b></div>
    <div class="chiprow shchips" id="shOpts"></div>
    <img class="shpic" id="shPic" alt="Map picture" hidden>
    <pre class="shprev" id="shPrev"></pre>
    <div class="btns"><button type="button" id="shCancel">Cancel</button><button type="button" class="primary" id="shGo">Share</button></div>
  </div>
</div>
<div class="modal sheetmenu" id="exportModal" hidden>
  <div class="card">
    <div class="im-title"><b>Export</b></div>
    <div class="shopts">
      <label><input type="radio" name="exf" value="csv"> <span>Spreadsheet (CSV)</span></label>
      <label><input type="radio" name="exf" value="geojson"> <span>ArcGIS (GeoJSON)</span></label>
    </div>
    <div class="shopts">
      <label><input type="radio" name="exs" value="all"> <span id="exAll">Everything</span></label>
      <label><input type="radio" name="exs" value="pick"> <span>Pick which ones</span></label>
    </div>
    <div class="shopts"><label><input type="checkbox" id="exPhotos"> <span>Include photos</span></label></div>
    <div class="btns"><button type="button" id="exCancel">Cancel</button><button type="button" class="primary" id="exGo">Export</button></div>
  </div>
</div>
<div class="undo" id="keepBar" hidden><span id="keepText"></span><button type="button" id="keepBtn">Add to notebook</button></div>
<div class="undo" id="undoBar" hidden><span id="undoText"></span><button type="button" id="undoBtn">Undo</button></div>
<div class="toast" id="toast"></div>
<!-- Tapping this switch's label gives a haptic tick on iPhone (iOS 18+); there's no vibrate API there -->
<input type="checkbox" switch id="hapticSw" tabindex="-1" aria-hidden="true" style="position:fixed;left:-99px;top:0;opacity:0">

<script src="vendor/leaflet/leaflet.js?v=127"></script>
<script src="config.js?v=127"></script>
<script src="osgb.js?v=127"></script>
<script src="parse.js?v=127"></script>
<script src="zip.js?v=127"></script>
<script src="exif.js?v=127"></script>
<script src="local.js?v=127"></script>
<script src="app.js?v=127"></script>
</body>
</html>
