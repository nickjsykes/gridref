<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Grid Ref</title>
<meta name="description" content="Find and share Ordnance Survey grid references on your phone.">
<meta name="theme-color" content="#2f5d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grid Ref">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root {
    --green: #2f5d3a;
    --green-soft: #e3ece4;
    --ink: #1c211d;
    --muted: #5f6b62;
    --panel: #ffffff;
    --line: #dde3de;
    --danger: #a33a2a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --green: #7fbf8c;
      --green-soft: #22332a;
      --ink: #eef2ee;
      --muted: #a3ada6;
      --panel: #161a17;
      --line: #2c332e;
      --danger: #ff8a75;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--panel); color: var(--ink); font-family: var(--sans); }
  #map { position: fixed; inset: 0; background: #dfe6df; }

  /* search */
  .top { position: fixed; z-index: 1000; left: 12px; right: 12px; top: calc(var(--safe-t) + 10px); display: flex; gap: 8px; }
  .search { flex: 1; display: flex; background: var(--panel); border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 16px var(--sans); padding: 12px 14px; outline: none; }
  .search button { border: 0; background: none; color: var(--green); font: 600 15px var(--sans); padding: 0 14px; }
  .results { max-height: 55vh; overflow-y: auto; position: fixed; z-index: 1001; left: 12px; right: 12px; top: calc(var(--safe-t) + 62px); background: var(--panel); border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.2); overflow: hidden; display: none; }
  .results button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); font: 15px var(--sans); padding: 13px 14px; }
  .results button small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .results button .tag { float: right; font: 600 11px var(--sans); color: var(--green); background: var(--green-soft); border-radius: 6px; padding: 2px 6px; margin-left: 8px; }
  .results .msg { padding: 13px 14px; color: var(--muted); font-size: 14px; }

  /* crosshair */
  .cross { position: fixed; z-index: 900; left: 50%; top: var(--cross-y, 40%); width: 44px; height: 44px; margin: -22px 0 0 -22px; pointer-events: none; }
  .cross::before, .cross::after { content: ""; position: absolute; background: #c0392b; box-shadow: 0 0 0 1.5px rgba(255,255,255,.85); }
  .cross::before { left: 21px; top: 0; width: 2px; height: 44px; }
  .cross::after { top: 21px; left: 0; height: 2px; width: 44px; }

  /* floating buttons */
  .fabs { position: fixed; z-index: 1000; right: 12px; display: flex; flex-direction: column; gap: 10px; bottom: calc(var(--sheet-h, 230px) + 12px); }
  .fab { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--panel); color: var(--ink); box-shadow: 0 2px 10px rgba(0,0,0,.22); display: grid; place-items: center; }
  .fab svg { width: 24px; height: 24px; }
  .fab.on { background: var(--green); color: var(--panel); }

  /* bottom sheet */
  .sheet { position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0; background: var(--panel); border-radius: 18px 18px 0 0; box-shadow: 0 -2px 16px rgba(0,0,0,.18); padding: 14px 16px calc(var(--safe-b) + 14px); display: flex; flex-direction: column; max-height: 60vh; }
  .grab { display: block; width: 100%; border: 0; background: none; padding: 0 0 8px; margin-top: -6px; touch-action: none; }
  .grab span { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
  .sheet.compact .more { display: none; }
  .more { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
  .meta { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .meta:has(.from-me:empty) { display: none; }
  .big { display: flex; align-items: center; width: 100%; gap: 10px; border: 0; background: none; color: var(--ink); padding: 4px 0 2px; text-align: left; }
  .ref { flex: 1; font: 700 clamp(26px, 8.6vw, 36px)/1.15 var(--mono); letter-spacing: .01em; white-space: nowrap; }
  .ref.off { font-size: 20px; color: var(--muted); font-family: var(--sans); font-weight: 500; }
  .c { display: inline-flex; align-items: center; gap: 4px; color: var(--green); font: 600 13px var(--sans); flex: none; border-radius: 10px; transition: background .15s; }
  .c svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .big .c { background: var(--green-soft); padding: 8px 10px; }
  .row .c { padding: 4px 8px; margin: -4px -8px -4px 0; }
  .row .c b { display: none; }
  .row.copied .c b, .row .c.open b { display: inline; }
  .rows { margin-top: 6px; border-top: 1px solid var(--line); flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); padding: 9px 0; text-align: left; }
  .row .k { width: 80px; flex: none; font: 600 12px var(--sans); color: var(--muted); }
  .row .v { flex: 1; min-width: 0; font: 14.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .v.dim { font-family: var(--sans); color: var(--muted); font-size: 14px; }
  .copied .c { color: var(--panel); background: var(--green); }
  a.row { text-decoration: none; }
  .row:active, .big:active { opacity: .6; }
  .from-me { font: 14px var(--sans); color: var(--green); min-width: 0; }
  .prec { display: inline-flex; background: var(--green-soft); border-radius: 9px; padding: 2px; }
  .prec button { border: 0; background: none; color: var(--muted); font: 600 13px var(--sans); padding: 5px 10px; border-radius: 7px; }
  .prec button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .actions { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 8px; margin-top: 12px; }
  .actions button { border: 0; border-radius: 12px; padding: 13px 6px; font: 600 15px var(--sans); background: var(--green-soft); color: var(--green); }
  .actions button.primary { background: var(--green); color: var(--panel); }

  /* saved points drawer */
  .drawer { position: fixed; z-index: 1100; inset: 0; background: var(--panel); display: none; flex-direction: column; padding-top: var(--safe-t); }
  .drawer.open { display: flex; }
  .drawer header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .drawer h2 { margin: 0; font-size: 19px; }
  .drawer header button, .link { border: 0; background: none; color: var(--green); font: 600 16px var(--sans); padding: 6px 0; }
  .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .item { padding: 13px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
  .item .main { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; font-size: 16px; }
  .item .gr { font: 15px var(--mono); margin-top: 2px; }
  .item .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .item button { border: 0; background: none; color: var(--danger); font: 14px var(--sans); padding: 8px; }
  .empty { padding: 40px 24px; color: var(--muted); text-align: center; line-height: 1.5; }
  .drawer footer { display: flex; gap: 8px; padding: 12px 16px calc(var(--safe-b) + 12px); border-top: 1px solid var(--line); }
  .backup { margin: 0; padding: 10px 16px 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .backup:empty { display: none; }
  .drawer footer button { flex: 1; border: 0; border-radius: 12px; padding: 13px; font: 600 15px var(--sans); background: var(--green-soft); color: var(--green); }

  /* Large text: for small phones and tired eyes in the field */
  /* the grid ref itself is the copy button here, so the digits get the full width */
  body.large .big .c { display: none; }
  body.large .big.copied .ref { color: var(--green); }
  body.large .c svg { width: 22px; height: 22px; }
  body.large .row { flex-wrap: wrap; row-gap: 2px; padding: 8px 0; }
  body.large .row .k { width: 100%; font-size: 13px; }
  body.large .row .v { font-size: clamp(16px, 5.4vw, 20px); font-weight: 600; }
  body.large .row .v.dim { font-size: 18px; }
  body.large .prec button { font-size: 16px; padding: 7px 12px; }
  body.large .actions button { font-size: 18px; padding: 16px 6px; }
  body.large .from-me { font-size: 17px; }
  body.large .search input { font-size: 18px; }
  body.large .results button { font-size: 18px; padding: 15px 14px; }
  body.large .results button small { font-size: 14px; }
  body.large .fab { width: 56px; height: 56px; }
  body.large .fab svg { width: 28px; height: 28px; }
  body.large .item .name { font-size: 19px; }
  body.large .item .gr { font-size: 18px; }
  body.large .layers button { font-size: 18px; padding: 15px 20px; }

  /* navigate: the map shows you, the flag and the line; the panel is the compass */
  .nav { display: none; }
  body.navigating .sheet > :not(.nav) { display: none; }
  body.navigating .nav { display: block; }
  body.navigating .cross { display: none; }
  .nav-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .nav-head small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .nav-head b { font: 700 24px var(--mono); }
  .nav-head button { border: 0; border-radius: 12px; padding: 12px 18px; font: 600 16px var(--sans); background: var(--green-soft); color: var(--green); }
  .nav-body { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
  .dial { width: min(42vw, 170px); height: min(42vw, 170px); flex: none; }
  .dial .ring { fill: var(--green-soft); stroke: var(--line); stroke-width: 2; }
  .dial .tick { stroke: var(--muted); stroke-width: 3; }
  .dial text { fill: var(--muted); font: 700 18px var(--sans); text-anchor: middle; }
  .dial text.n { fill: #c0392b; font-size: 22px; }
  .dial .arrow { fill: var(--green); stroke: var(--panel); stroke-width: 3; stroke-linejoin: round; }
  .dial.here .arrow { fill: #c0392b; }
  #rose, #arrow { transition: transform .25s linear; }
  .nav-nums { flex: 1; min-width: 0; font-size: 16px; line-height: 1.5; }
  .nav-nums .dist { font: 700 clamp(30px, 10vw, 44px)/1.1 var(--mono); }
  .nav-nums .dim { color: var(--muted); font-size: 14px; }
  .nav-hint { color: var(--muted); font-size: 13px; margin-top: 6px; min-height: 18px; }
  body.large .nav-head b { font-size: 28px; }
  body.large .nav-nums { font-size: 19px; }
  body.large .nav-nums .dist { font-size: clamp(36px, 12vw, 54px); }
  .flag { font-size: 30px; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }

  /* search results: every answer shown as a grid ref */
  .results button .gr { display: block; font: 700 19px var(--mono); }
  body.large .results button .gr { font-size: 23px; }

  /* no visible scrollbars anywhere: lists still scroll with a finger */
  .rows, .results, .list, .layers { scrollbar-width: none; }
  .rows::-webkit-scrollbar, .results::-webkit-scrollbar, .list::-webkit-scrollbar, .layers::-webkit-scrollbar { display: none; }

  .toast { position: fixed; z-index: 1200; left: 50%; top: calc(var(--safe-t) + 70px); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }

  .leaflet-control-attribution { font-size: 9px; }
  .leaflet-bottom { bottom: var(--sheet-h, 230px); }
  .grid-label { color: #1d4f8f; font: 600 11px var(--mono); text-shadow: 0 0 3px #fff, 0 0 3px #fff; white-space: nowrap; }
  .layers { position: fixed; z-index: 1001; right: 70px; bottom: calc(var(--sheet-h, 230px) + 12px); background: var(--panel); border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.22); overflow: hidden; display: none; }
  .layers button { display: block; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); font: 15px var(--sans); padding: 12px 18px; text-align: left; }
  .layers button.ver { color: var(--muted); font-size: 12px; padding: 8px 18px; }
  .layers button.on { color: var(--green); font-weight: 700; }
</style>
</head>
<body>
<div id="map"></div>
<div class="cross" aria-hidden="true"></div>

<div class="top">
  <form class="search" id="searchForm" autocomplete="off">
    <input id="q" type="search" enterkeyhint="search" placeholder="Grid ref, postcode or place" aria-label="Search">
    <button type="submit">Go</button>
  </form>
</div>
<div class="results" id="results"></div>

<div class="fabs">
  <button class="fab" id="layersBtn" aria-label="Map style">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg>
  </button>
  <button class="fab" id="listBtn" aria-label="Saved points">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 6.5C9.5 4.6 6 4.3 3 5.3v13.4c3-1 6.5-.7 9 1.2 2.5-1.9 6-2.2 9-1.2V5.3c-3-1-6.5-.7-9 1.2Z" stroke-linejoin="round"/><path d="M12 6.5v13.4"/></svg>
  </button>
  <button class="fab" id="locBtn" aria-label="Show my location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
</div>
<div class="layers" id="layers"></div>

<section class="sheet" id="sheet">
  <button class="grab" id="grab" aria-label="Show or hide details"><span></span></button>
  <button class="big" data-copy="ref" aria-label="Copy grid reference">
    <span class="ref" id="ref">—</span>
    <span class="c"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><b>Copy</b></span>
  </button>
  <div class="more">
    <div class="meta">
      <span class="from-me" id="fromMe"></span>
    </div>
    <div class="rows">
      <button class="row" data-copy="en"><span class="k">E / N</span><span class="v" id="vEN"></span><span class="c"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><b>Copy</b></span></button>
      <button class="row" data-copy="ll"><span class="k">Lat / Long</span><span class="v" id="vLL"></span><span class="c"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><b>Copy</b></span></button>
      <a class="row" id="w3wRow" target="_blank" rel="noopener"><span class="k">what3words</span><span class="v" id="vW3W"></span><span class="c" id="w3wAct"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><b>Open</b></span></a>
    </div>
    <div class="actions">
      <button id="shareBtn">Share</button>
      <button class="primary" id="navBtn">Navigate</button>
      <button id="saveBtn">Save</button>
    </div>
  </div>
  <div class="nav" id="nav">
    <div class="nav-head">
      <div><small>Going to</small><b id="navRef"></b></div>
      <button id="navEnd">End</button>
    </div>
    <div class="nav-body">
      <svg class="dial" viewBox="-100 -100 200 200" aria-hidden="true">
        <g id="rose">
          <circle r="92" class="ring"/>
          <path d="M0-92v14M0 78v14M-92 0h14M78 0h14" class="tick"/>
          <text y="-60" class="n">N</text><text x="62" y="6">E</text><text y="72">S</text><text x="-62" y="6">W</text>
        </g>
        <g id="arrow"><path d="M0-70 26 30 0 14-26 30Z" class="arrow"/></g>
      </svg>
      <div class="nav-nums">
        <div class="dist" id="navDist">—</div>
        <div id="navBrg"></div>
        <div class="dim" id="navAcc"></div>
      </div>
    </div>
    <div class="nav-hint" id="navHint"></div>
  </div>
</section>

<div class="drawer" id="drawer">
  <header>
    <h2>Saved points</h2>
    <button id="closeDrawer">Done</button>
  </header>
  <div class="list" id="list"></div>
  <p class="backup" id="backup"></p>
  <footer>
    <button id="importBtn">Import CSV</button>
    <button id="exportBtn">Share as CSV</button>
    <input type="file" id="importFile" accept=".csv,text/csv,text/plain" hidden>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="config.js"></script>
<script src="osgb.js"></script>
<script src="parse.js"></script>
<script src="local.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("gridref." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("gridref." + k, JSON.stringify(v)); return true; } catch { return false; } },
  };

  // ---------- map ----------
  const LAYERS = {
    topo: { name: "Topo (contours)", layer: L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", { maxZoom: 17, subdomains: "abc", crossOrigin: true, attribution: "© OpenStreetMap, SRTM | © OpenTopoMap (CC-BY-SA)" }) },
    street: { name: "Street map", layer: L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, crossOrigin: true, attribution: "© OpenStreetMap contributors" }) },
    aerial: { name: "Aerial photo", layer: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Imagery © Esri, Maxar, Earthstar Geographics" }) },
  };
  const start = store.get("view", { lat: 54.25, lon: -2.95, z: 11 });
  const map = L.map("map", { zoomControl: false, attributionControl: true, tap: false }).setView([start.lat, start.lon], start.z);
  map.attributionControl.addAttribution("OS data © Crown copyright 2026");
  let current = LAYERS[store.get("layer", "topo")] ? store.get("layer", "topo") : "topo";
  LAYERS[current].layer.addTo(map);

  let large = store.get("large", false);
  function keepTarget(change) {
    const t = target();
    change();
    layout();
    panTo(t, map.getZoom(), false);
    fitRef();
    update();
  }
  function setLarge(on) {
    keepTarget(() => {
      large = on;
      store.set("large", on);
      document.body.classList.toggle("large", on);
    });
  }
  document.body.classList.toggle("large", large);

  const VERSION = "28"; // bump with each release so a phone can show which copy it's running
  const layersEl = $("layers");
  function drawLayerMenu() {
    layersEl.innerHTML = "";
    for (const [k, v] of Object.entries(LAYERS)) {
      const b = document.createElement("button");
      b.textContent = v.name;
      b.className = k === current ? "on" : "";
      b.onclick = () => {
        map.removeLayer(LAYERS[current].layer);
        current = k;
        LAYERS[k].layer.addTo(map);
        store.set("layer", k);
        layersEl.style.display = "none";
      };
      layersEl.appendChild(b);
    }
    const fig = document.createElement("button");
    fig.textContent = `Grid ref: ${digits}-figure (tap for ${digits === 8 ? 6 : 8})`;
    fig.onclick = () => { setPrec(digits === 8 ? 6 : 8); layersEl.style.display = "none"; };
    layersEl.appendChild(fig);
    const big = document.createElement("button");
    big.textContent = (large ? "✓ " : "") + "Large text";
    big.onclick = () => { setLarge(!large); layersEl.style.display = "none"; };
    layersEl.appendChild(big);
    const off = document.createElement("button");
    off.textContent = "Save this area for offline";
    off.onclick = () => { layersEl.style.display = "none"; saveArea(); };
    layersEl.appendChild(off);
    const ver = document.createElement("button");
    ver.textContent = "Version " + VERSION;
    ver.disabled = true;
    ver.className = "ver";
    layersEl.appendChild(ver);
  }
  $("layersBtn").onclick = () => {
    const open = layersEl.style.display === "block";
    if (!open) drawLayerMenu();
    layersEl.style.display = open ? "none" : "block";
  };

  // Keep the crosshair in the middle of the visible map (above the sheet)
  const sheet = $("sheet");
  function layout() {
    const h = sheet.offsetHeight;
    document.documentElement.style.setProperty("--sheet-h", h + "px");
    document.documentElement.style.setProperty("--cross-y", (window.innerHeight - h) / 2 + "px");
  }
  // The point under the crosshair, not the map's geometric centre
  function target() {
    const size = map.getSize();
    return map.containerPointToLatLng([size.x / 2, (window.innerHeight - sheet.offsetHeight) / 2]);
  }
  function panTo(latlng, zoom, animate = true) {
    const z = Math.min(zoom || map.getZoom(), map.getMaxZoom());
    const offsetY = (window.innerHeight - (window.innerHeight - sheet.offsetHeight) / 2) - window.innerHeight / 2;
    const p = map.project(latlng, z).add([0, offsetY]);
    map.setView(map.unproject(p, z), z, { animate });
  }

  // ---------- OS grid overlay ----------
  const gridLayer = L.layerGroup().addTo(map);
  function drawGrid() {
    gridLayer.clearLayers();
    const z = map.getZoom();
    const step = z >= 13 ? 1000 : z >= 10 ? 10000 : 100000;
    const b = map.getBounds();
    const corners = [b.getSouthWest(), b.getNorthWest(), b.getNorthEast(), b.getSouthEast()].map((c) => OSGB.wgs84ToGrid(c.lat, c.lng));
    const minE = Math.max(0, Math.floor(Math.min(...corners.map((c) => c.e)) / step) * step);
    const maxE = Math.min(700000, Math.ceil(Math.max(...corners.map((c) => c.e)) / step) * step);
    const minN = Math.max(0, Math.floor(Math.min(...corners.map((c) => c.n)) / step) * step);
    const maxN = Math.min(1300000, Math.ceil(Math.max(...corners.map((c) => c.n)) / step) * step);
    if ((maxE - minE) / step > 80 || (maxN - minN) / step > 80) return;
    const style = { color: "#1d4f8f", weight: step === 100000 ? 2 : 1, opacity: 0.55, interactive: false };
    const seg = 8;
    for (let e = minE; e <= maxE; e += step) {
      const pts = [];
      for (let i = 0; i <= seg; i++) { const ll = OSGB.gridToWgs84(e, minN + ((maxN - minN) * i) / seg); pts.push([ll.lat, ll.lon]); }
      L.polyline(pts, style).addTo(gridLayer);
    }
    for (let n = minN; n <= maxN; n += step) {
      const pts = [];
      for (let i = 0; i <= seg; i++) { const ll = OSGB.gridToWgs84(minE + ((maxE - minE) * i) / seg, n); pts.push([ll.lat, ll.lon]); }
      L.polyline(pts, style).addTo(gridLayer);
    }
    // Label the 1 km / 10 km lines along the top and left edges of the screen
    if (step <= 10000) {
      const div = step === 1000 ? 1000 : 10000;
      const digits = step === 1000 ? 2 : 1;
      const top = map.getBounds().getNorth(), left = map.getBounds().getWest();
      for (let e = minE + step; e < maxE; e += step) {
        const ll = OSGB.gridToWgs84(e + step * 0.04, OSGB.wgs84ToGrid(top, map.getCenter().lng).n - step * 0.0);
        const txt = String(Math.floor((e % 100000) / div)).padStart(digits, "0");
        L.marker([top, ll.lon], { interactive: false, icon: L.divIcon({ className: "grid-label", html: txt, iconSize: null, iconAnchor: [-2, -74] }) }).addTo(gridLayer);
      }
      for (let n = minN + step; n < maxN; n += step) {
        const ll = OSGB.gridToWgs84(OSGB.wgs84ToGrid(map.getCenter().lat, left).e, n);
        const txt = String(Math.floor((n % 100000) / div)).padStart(digits, "0");
        L.marker([ll.lat, left], { interactive: false, icon: L.divIcon({ className: "grid-label", html: txt, iconSize: null, iconAnchor: [-4, 14] }) }).addTo(gridLayer);
      }
    }
  }

  // ---------- readout ----------
  // 6 or 8 figures only: phone GPS (~5 m in the open, worse under trees) plus the ~3-5 m
  // datum shift can't support a 10-figure (1 m) ref. 10-figure refs can still be searched.
  let digits = store.get("digits", 8) === 6 ? 6 : 8;
  let here = null; // { lat, lon, acc }
  function setPrec(d) {
    digits = d;
    store.set("digits", d);
    update();
  }

  function info(latlng) {
    const g = OSGB.wgs84ToGrid(latlng.lat, latlng.lng);
    return { lat: latlng.lat, lon: latlng.lng, e: g.e, n: g.n, ref: OSGB.gridRef(g.e, g.n, digits) };
  }

  function bearing(a, b) {
    const φ1 = a.lat * Math.PI / 180, φ2 = b.lat * Math.PI / 180, Δλ = (b.lng - a.lng) * Math.PI / 180;
    const y = Math.sin(Δλ) * Math.cos(φ2), x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }
  function fmtDist(m) { return m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(m < 10000 ? 2 : 1) + " km"; }

  // Monospace digits are ~0.6em wide: size the ref to the room left beside its Copy button
  function fitRef() {
    const ref = $("ref");
    if (ref.classList.contains("off")) { ref.style.fontSize = ""; return; }
    const box = ref.parentElement, btn = box.querySelector(".c");
    const room = box.clientWidth - (btn.offsetWidth ? btn.offsetWidth + 12 : 0);
    ref.style.fontSize = Math.max(20, Math.min(large ? 54 : 38, room / (ref.textContent.length * 0.62))) + "px";
  }

  let last = null;
  function update() {
    const t = following && here ? L.latLng(here.lat, here.lon) : target();
    const p = info(t);
    p.en = `${Math.round(p.e)}, ${Math.round(p.n)}`;
    p.ll = `${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`;
    last = p;
    const ref = $("ref");
    if (ref.textContent !== (p.ref || "Outside the GB grid")) {
      ref.textContent = p.ref || "Outside the GB grid";
      ref.classList.toggle("off", !p.ref);
      fitRef();
    }
    $("vEN").textContent = p.ref ? p.en : "—";
    $("vLL").textContent = p.ll;
    w3wUpdate(p);
    if (following && here) {
      $("fromMe").textContent = `You are here, GPS ±${Math.round(here.acc)} m`;
    } else if (here) {
      const me = L.latLng(here.lat, here.lon);
      const d = me.distanceTo(t);
      $("fromMe").textContent = d < 3 ? "" : `${fmtDist(d)} from you, bearing ${String(Math.round(bearing(me, t))).padStart(3, "0")}°`;
    } else {
      $("fromMe").textContent = "";
    }
    layout();
  }

  // ---------- what3words ----------
  // With an API key (config.js) the 3 words show in the row; without one the row
  // opens what3words at this spot, which shows the words there.
  const W3W_KEY = (window.GRIDREF_CONFIG || {}).what3wordsKey || "";
  const COPY_ICON = document.querySelector(".row .c").innerHTML;
  const OPEN_ICON = $("w3wAct").innerHTML;
  let w3w = { at: "", words: "" }, w3wTimer;
  const spot = (p) => p.lat.toFixed(5) + "," + p.lon.toFixed(5);
  function w3wShow(text, isWords) {
    const v = $("vW3W");
    v.textContent = text;
    v.className = isWords ? "v" : "v dim";
    if (!$("w3wAct").closest(".copied")) $("w3wAct").innerHTML = isWords ? COPY_ICON : OPEN_ICON;
    $("w3wAct").classList.toggle("open", !isWords);
  }
  // A real link the user taps (not a scripted click): that is what makes iPhones hand it
  // to the what3words app cleanly. On Android an intent link opens only the app.
  function w3wHref(path) {
    const web = "https://what3words.com/" + path;
    return /Android/i.test(navigator.userAgent)
      ? "intent://what3words.com/" + path + "#Intent;scheme=https;package=com.what3words.android;S.browser_fallback_url=" + encodeURIComponent(web) + ";end"
      : web;
  }
  function w3wUpdate(p) {
    $("w3wRow").href = w3wHref(p.lat.toFixed(6) + "," + p.lon.toFixed(6));
    if (!W3W_KEY) return w3wShow("Show the 3 words", false);
    const at = spot(p);
    if (w3w.at === at && w3w.words) return w3wShow("///" + w3w.words, true);
    w3wShow("…", false);
    clearTimeout(w3wTimer);
    w3wTimer = setTimeout(async () => {
      try {
        const r = await fetch(`https://api.what3words.com/v3/convert-to-3wa?coordinates=${at}&language=en&key=${W3W_KEY}`);
        const j = await r.json();
        if (!j.words) throw new Error(j.error && j.error.message);
        w3w = { at, words: j.words };
        if (last && spot(last) === at) w3wShow("///" + j.words, true);
      } catch {
        if (last && spot(last) === at) w3wShow(navigator.onLine ? "Show the 3 words" : "Needs signal", false);
      }
    }, 450);
  }
  function openLink(url) {
    const a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  // With words showing (API key), tapping the row copies them instead of opening
  $("w3wRow").addEventListener("click", (e) => {
    if (last && w3w.words && w3w.at === spot(last)) { e.preventDefault(); copy("///" + w3w.words, $("w3wRow")); }
  });

  let saveView;
  map.on("move", update);
  map.on("moveend", () => {
    drawGrid();
    clearTimeout(saveView);
    saveView = setTimeout(() => { const c = map.getCenter(); store.set("view", { lat: c.lat, lon: c.lng, z: map.getZoom() }); }, 500);
  });
  map.on("dragstart", () => { if (following) { following = false; $("locBtn").classList.remove("on"); update(); } });
  map.on("click", (e) => { layersEl.style.display = "none"; $("results").style.display = "none"; if (!nav) panTo(e.latlng); });

  // ---------- GPS ----------
  let watchId = null, following = false, meDot = null, meRing = null;
  function startGps(follow = true) {
    if (!navigator.geolocation) { toast("Location isn't available on this device"); return; }
    if (follow) {
      following = true;
      $("locBtn").classList.add("on");
      if (here) { panTo(L.latLng(here.lat, here.lon), Math.max(map.getZoom(), 15)); update(); }
    }
    if (watchId != null) return;
    toast("Finding you…");
    let first = true;
    watchId = navigator.geolocation.watchPosition((pos) => {
      here = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy };
      const ll = L.latLng(here.lat, here.lon);
      if (!meDot) {
        meRing = L.circle(ll, { radius: here.acc, color: "#1a73e8", weight: 1, fillOpacity: 0.12, interactive: false }).addTo(map);
        meDot = L.circleMarker(ll, { radius: 7, color: "#fff", weight: 2.5, fillColor: "#1a73e8", fillOpacity: 1, interactive: false }).addTo(map);
      } else {
        meRing.setLatLng(ll).setRadius(here.acc);
        meDot.setLatLng(ll);
      }
      if (following && !nav) panTo(ll, first ? Math.max(map.getZoom(), 15) : undefined);
      first = false;
      update();
      if (nav) drawNav();
    }, (err) => {
      following = false;
      $("locBtn").classList.remove("on");
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      toast(err.code === 1 ? "Location blocked — allow it in Settings › Safari" : "Couldn't get a GPS fix");
    }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });
  }
  $("locBtn").onclick = () => {
    if (following) { following = false; $("locBtn").classList.remove("on"); update(); }
    else startGps();
  };

  // ---------- actions ----------
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => t.classList.remove("show"), 1800);
  }
  async function copy(text, el) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch {
      // Older iOS: copy through a temporary text box
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      try { ok = document.execCommand("copy"); } catch {}
      ta.remove();
    }
    if (!ok) return toast("Couldn't copy on this phone");
    if (!el || (large && el.classList.contains("big"))) toast("Copied " + text);
    if (!el) return;
    const b = el.querySelector(".c b"), was = b.dataset.was || (b.dataset.was = b.textContent);
    el.classList.add("copied");
    b.textContent = "Copied";
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.classList.remove("copied"); b.textContent = was; }, 1300);
  }
  for (const el of document.querySelectorAll("[data-copy]")) {
    el.onclick = () => {
      if (!last) return;
      const what = el.dataset.copy;
      if ((what === "ref" || what === "en") && !last.ref) return;
      copy(last[what], el);
    };
  }
  function shareText(p) {
    const lines = [`Grid ref: ${p.ref}`, `E/N: ${p.en}`, `Lat/long: ${p.ll}`];
    if (w3w.words && w3w.at === spot(p)) lines.push(`what3words: ///${w3w.words}`);
    lines.push(`https://maps.apple.com/?ll=${p.lat.toFixed(6)},${p.lon.toFixed(6)}&q=${encodeURIComponent(p.ref)}`);
    return lines.join("\n");
  }
  $("shareBtn").onclick = async () => {
    if (!last || !last.ref) return;
    const text = shareText(last);
    if (navigator.share) { try { await navigator.share({ text }); } catch {} }
    else copy(text);
  };

  // ---------- saved points ----------
  // Kept in this browser's localStorage. Re-read before every change so two open
  // copies of the app can't overwrite each other's points.
  let points = store.get("points", []);
  const fresh = () => (points = store.get("points", points));
  function savePoints() {
    const ok = store.set("points", points);
    drawPins();
    if (!ok) alert("This phone wouldn't let Grid Ref save. Share your points as CSV now so nothing is lost.");
    return ok;
  }
  window.addEventListener("storage", (e) => { if (e.key === "gridref.points") { fresh(); drawPins(); } });
  // Ask the browser not to clear our storage when space runs low
  const persist = () => { try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {} };
  const pinLayer = L.layerGroup().addTo(map);
  function drawPins() {
    pinLayer.clearLayers();
    for (const pt of points) {
      L.circleMarker([pt.lat, pt.lon], { radius: 6, color: "#fff", weight: 2, fillColor: "#e67e22", fillOpacity: 1 })
        .bindTooltip(pt.name, { direction: "top", offset: [0, -6] })
        .addTo(pinLayer);
    }
  }
  $("saveBtn").onclick = () => {
    if (!last || !last.ref) return;
    fresh();
    const def = "Point " + (points.length + 1);
    const name = prompt("Name this point", def);
    if (name === null) return;
    fresh();
    points.unshift({ name: name.trim() || def, lat: last.lat, lon: last.lon, e: Math.round(last.e), n: Math.round(last.n), at: new Date().toISOString(), acc: following && here ? Math.round(here.acc) : null });
    persist();
    if (savePoints()) toast("Saved — " + points.length + " point" + (points.length === 1 ? "" : "s"));
  };
  $("listBtn").onclick = () => openDrawer();

  function ago(iso) {
    if (!iso) return "never";
    const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
    return d < 1 ? "today" : d === 1 ? "yesterday" : d + " days ago";
  }
  function openDrawer() {
    fresh();
    const list = $("list");
    list.innerHTML = "";
    if (!points.length) list.innerHTML = '<div class="empty">No saved points yet.<br>Line up the crosshair and tap <b>Save point</b>.<br><br>Got a list of grid refs? <b>Import</b> a CSV.</div>';
    points.forEach((pt) => {
      const row = document.createElement("div");
      row.className = "item";
      const when = new Date(pt.at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      row.innerHTML = `<div class="main"><div class="name"></div><div class="gr">${OSGB.gridRef(pt.e, pt.n, digits)}</div><div class="meta">${when}${pt.acc ? " · GPS ±" + pt.acc + " m" : ""}</div></div><button>Delete</button>`;
      row.querySelector(".name").textContent = pt.name;
      row.querySelector(".main").onclick = () => { closeDrawer(); following = false; $("locBtn").classList.remove("on"); panTo(L.latLng(pt.lat, pt.lon), Math.max(map.getZoom(), 15)); };
      row.querySelector("button").onclick = () => {
        if (!confirm(`Delete “${pt.name}”?`)) return;
        fresh();
        points = points.filter((p) => !(p.at === pt.at && p.name === pt.name));
        savePoints();
        openDrawer();
      };
      list.appendChild(row);
    });
    const exported = store.get("exported", "");
    const since = exported ? points.filter((p) => p.at > exported).length : 0;
    $("backup").textContent = points.length
      ? `${points.length} point${points.length === 1 ? "" : "s"}, kept on this phone only. Last shared as CSV: ${ago(exported)}${since ? ` (${since} new since)` : ""}.`
      : "";
    $("drawer").classList.add("open");
  }
  function closeDrawer() { $("drawer").classList.remove("open"); }
  $("closeDrawer").onclick = closeDrawer;
  $("exportBtn").onclick = async () => {
    fresh();
    if (!points.length) return;
    const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
    const rows = [["Name", "Grid ref", "Easting", "Northing", "Latitude", "Longitude", "GPS accuracy (m)", "Saved"]]
      .concat(points.map((p) => [q(p.name), OSGB.gridRef(p.e, p.n, 10), p.e, p.n, p.lat.toFixed(6), p.lon.toFixed(6), p.acc ?? "", p.at]));
    const csv = rows.map((r) => r.join(",")).join("\n");
    const file = new File([csv], "grid-refs-" + new Date().toISOString().slice(0, 10) + ".csv", { type: "text/csv" });
    let done = false;
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); done = true; } catch {}
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(file);
      a.download = file.name;
      a.click();
      done = true;
    }
    if (done) { store.set("exported", new Date().toISOString()); openDrawer(); }
  };

  // Import: our own CSV back in, or any CSV with a name column and a grid ref,
  // E/N or lat/long column (e.g. a list of dormouse boxes)
  function parseCSV(text) {
    const rows = [];
    let row = [], cell = "", quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (quoted) {
        if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (ch === '"') quoted = false;
        else cell += ch;
      } else if (ch === '"') quoted = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.filter((r) => r.some((c) => c.trim()));
  }
  function importCSV(text) {
    const rows = parseCSV(text.replace(/^﻿/, ""));
    if (rows.length < 2) return { added: 0, skipped: 0 };
    const head = rows[0].map((h) => h.trim().toLowerCase());
    const col = (...names) => head.findIndex((h) => names.some((n) => h === n || h.startsWith(n)));
    const iName = col("name", "label", "box", "id", "title"), iRef = col("grid ref", "gridref", "grid reference", "osgr", "ngr", "ref");
    const iE = col("easting", "x"), iN = col("northing", "y"), iLat = col("lat"), iLon = col("lon", "lng", "long");
    const iAt = col("saved", "date", "time"), iAcc = col("gps accuracy", "accuracy");
    fresh();
    const seen = new Set(points.map((p) => p.name + "|" + p.e + "|" + p.n));
    let added = 0, skipped = 0;
    for (const r of rows.slice(1)) {
      const get = (i) => (i >= 0 ? (r[i] || "").trim() : "");
      let ll = null;
      if (get(iLat) && get(iLon) && !isNaN(+get(iLat)) && !isNaN(+get(iLon))) ll = { lat: +get(iLat), lon: +get(iLon) };
      else if (get(iRef)) ll = GridSearch.parse(get(iRef)).find((x) => x.lat != null) || null;
      else if (get(iE) && get(iN) && OSGB.inGrid(+get(iE), +get(iN))) ll = OSGB.gridToWgs84(+get(iE), +get(iN));
      if (!ll) { skipped++; continue; }
      const g = OSGB.wgs84ToGrid(ll.lat, ll.lon);
      const at = get(iAt) && !isNaN(Date.parse(get(iAt))) ? new Date(get(iAt)).toISOString() : new Date().toISOString();
      const pt = { name: get(iName) || "Imported " + (added + 1), lat: ll.lat, lon: ll.lon, e: Math.round(g.e), n: Math.round(g.n), at, acc: +get(iAcc) || null };
      const key = pt.name + "|" + pt.e + "|" + pt.n;
      if (seen.has(key)) { skipped++; continue; }
      seen.add(key);
      points.push(pt);
      added++;
    }
    points.sort((a, b) => (a.at < b.at ? 1 : -1));
    if (added) { persist(); savePoints(); }
    return { added, skipped };
  }
  window.__importCSV = importCSV; // for testing
  $("importBtn").onclick = () => $("importFile").click();
  $("importFile").onchange = async (e) => {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    const { added, skipped } = importCSV(await f.text());
    openDrawer();
    toast(`Imported ${added}` + (skipped ? `, skipped ${skipped}` : ""));
  };

  // ---------- search ----------
  const resultsEl = $("results");
  function showResults(items, msg) {
    resultsEl.innerHTML = "";
    if (msg) {
      const m = document.createElement("div");
      m.className = "msg";
      m.textContent = msg;
      resultsEl.appendChild(m);
    }
    for (const it of items) {
      const b = document.createElement("button");
      // Everything is shown as the grid ref it lands on; the name goes underneath
      b.innerHTML = "<span class='tag'></span><span class='gr'></span><span class='t'></span><small></small>";
      const gr = it.lat != null ? fmtRef(it.lat, it.lon) : "";
      if (it.tag) b.querySelector(".tag").textContent = it.tag;
      else b.querySelector(".tag").remove();
      b.querySelector(".gr").textContent = gr || it.title;
      if (gr && it.title !== gr) b.querySelector(".t").textContent = it.title;
      else b.querySelector(".t").remove();
      b.querySelector("small").textContent = it.sub || "";
      b.onclick = () => go(it);
      resultsEl.appendChild(b);
    }
    resultsEl.style.display = items.length || msg ? "block" : "none";
  }
  function go(it) {
    if (it.url) return openLink(it.w3w ? w3wHref(it.w3w) : it.url);
    resultsEl.style.display = "none";
    $("q").blur();
    following = false;
    $("locBtn").classList.remove("on");
    setCompact(true); // just the grid ref; swipe up for the other formats
    panTo(L.latLng(it.lat, it.lon), it.zoom || 15);
  }
  const fmtRef = (lat, lon) => { const g = OSGB.wgs84ToGrid(lat, lon); return OSGB.gridRef(g.e, g.n, digits); };
  async function getJSON(url) { const r = await fetch(url); return r.json(); }

  // One parsed reading -> result rows (postcodes and what3words need a lookup)
  async function resolve(r) {
    if (r.lat != null) {
      const ll = `${r.lat.toFixed(5)}, ${r.lon.toFixed(5)}`;
      return [{ title: r.title || fmtRef(r.lat, r.lon) || ll, sub: ll, tag: r.label, lat: r.lat, lon: r.lon, zoom: r.zoom }];
    }
    if (r.kind === "postcode") {
      try { const hit = await LocalSearch.postcode(r.code); if (hit) return [hit]; } catch {}
      const j = await getJSON("https://api.postcodes.io/postcodes/" + r.code);
      if (!j.result) return [];
      const x = j.result;
      return [{ title: x.postcode, sub: [x.admin_ward, x.admin_district].filter(Boolean).join(", "), tag: "Postcode", lat: x.latitude, lon: x.longitude, zoom: 16 }];
    }
    if (r.kind === "outcode") {
      try { const hit = await LocalSearch.outcode(r.code); if (hit) return [hit]; } catch {}
      const j = await getJSON("https://api.postcodes.io/outcodes/" + r.code);
      if (!j.result) return [];
      const x = j.result;
      return [{ title: x.outcode, sub: (x.admin_district || []).slice(0, 2).join(", "), tag: "Postcode area", lat: x.latitude, lon: x.longitude, zoom: 13 }];
    }
    if (r.kind === "w3w") {
      if (W3W_KEY) {
        const j = await getJSON(`https://api.what3words.com/v3/convert-to-coordinates?words=${encodeURIComponent(r.words)}&key=${W3W_KEY}`);
        if (j.coordinates) return [{ title: "///" + r.words, sub: j.nearestPlace || "", tag: "what3words", lat: j.coordinates.lat, lon: j.coordinates.lng, zoom: 18 }];
      }
      return [{ title: "///" + r.words, sub: "Opens in what3words", tag: "what3words", url: "https://what3words.com/" + r.words, w3w: r.words }];
    }
    return [];
  }

  // Place names, as you type (Photon allows type-ahead; Nominatim doesn't)
  async function places(text) {
    const c = map.getCenter();
    const j = await getJSON(`https://photon.komoot.io/api/?q=${encodeURIComponent(text)}&limit=7&lang=en&bbox=-8.8,49.8,2.0,60.95&lat=${c.lat.toFixed(3)}&lon=${c.lng.toFixed(3)}`);
    const zoomFor = { city: 12, town: 13, village: 14, hamlet: 15, county: 10, state: 8, district: 13 };
    return (j.features || []).map((f) => {
      const p = f.properties, [lon, lat] = f.geometry.coordinates;
      let kind = p.osm_value === "yes" ? p.osm_key : p.osm_value || p.type || "";
      kind = kind.replace(/_/g, " ");
      const where = [p.city || p.town || p.village, p.county || p.state].filter((x) => x && x !== p.name);
      return {
        title: p.name || p.street || "Unnamed",
        sub: [kind && kind[0].toUpperCase() + kind.slice(1), ...where].join(" · "),
        lat, lon, zoom: zoomFor[p.type] || zoomFor[p.osm_value] || 16,
      };
    });
  }

  let seq = 0, typing;
  async function search(text, submit) {
    const my = ++seq;
    text = text.trim();
    if (!text) return showResults([]);
    const readings = GridSearch.parse(text);
    if (readings.some((r) => r.kind === "link-unknown")) {
      return showResults([], "Can't read a location from that link. Short links (maps.app.goo.gl) hide it: open the link, then copy the coordinates in.");
    }
    const items = [];
    // Grid refs, E/N, lat/long and map links work offline and show at once
    for (const r of readings) if (r.lat != null) items.push(...(await resolve(r)));
    if (items.length && !submit) showResults(items);
    const exact = readings.some((r) => r.lat != null || r.kind === "postcode" || r.kind === "w3w");
    // Places from the offline OS data (Cumbria and north Lancashire) show at once
    if (!exact && text.length >= 2) {
      try { items.push(...(await LocalSearch.searchPlaces(text, map.getCenter(), 6))); } catch {}
      if (my !== seq) return;
      if (items.length && !submit) showResults(items);
    }
    let offline = false;
    try {
      for (const r of readings) if (r.lat == null) items.push(...(await resolve(r)));
    } catch { offline = true; }
    // Then everywhere else, online. Skip anything the offline data already found.
    if (!exact && text.length >= 3 && !(submit && items.length)) {
      try {
        const near = (it) => items.some((x) => LocalSearch.norm(x.title) === LocalSearch.norm(it.title) && L.latLng(x.lat, x.lon).distanceTo([it.lat, it.lon]) < 800);
        items.push(...(await places(text)).filter((it) => !near(it)));
      } catch { offline = true; }
    }
    if (my !== seq) return;
    if (offline && !items.length) return showResults([], "No signal, and not in the offline place list. Grid refs, E/N and lat/long always work.");
    if (my !== seq) return;
    if (submit && items.length) return go(items[0]);
    showResults(items, items.length ? "" : text.length >= 3 ? "Nothing found. Try a grid ref (SD 339 836), postcode, lat/long or place." : "");
  }
  $("searchForm").onsubmit = (ev) => { ev.preventDefault(); clearTimeout(typing); search($("q").value, true); };
  $("q").addEventListener("input", () => {
    clearTimeout(typing);
    const v = $("q").value;
    if (!v.trim()) return showResults([]);
    typing = setTimeout(() => search(v, false), 280);
  });
  $("q").addEventListener("focus", () => { if ($("q").value.trim()) search($("q").value, false); });

  // ---------- sheet: swipe down for just the grid ref, up for everything ----------
  function setCompact(on) {
    if ($("sheet").classList.contains("compact") === on) return;
    keepTarget(() => { $("sheet").classList.toggle("compact", on); store.set("compact", on); });
  }
  $("sheet").classList.toggle("compact", store.get("compact", false));
  $("grab").onclick = () => setCompact(!$("sheet").classList.contains("compact"));
  let swipe = null;
  $("sheet").addEventListener("touchstart", (e) => {
    // Leave the format list free to scroll
    if (e.target.closest(".rows") || document.body.classList.contains("navigating")) return (swipe = null);
    swipe = { y: e.touches[0].clientY, moved: false };
  }, { passive: true });
  $("sheet").addEventListener("touchmove", (e) => {
    if (swipe && Math.abs(e.touches[0].clientY - swipe.y) > 10) swipe.moved = true;
  }, { passive: true });
  $("sheet").addEventListener("touchend", (e) => {
    if (!swipe) return;
    const dy = e.changedTouches[0].clientY - swipe.y;
    if (dy > 35) setCompact(true);
    else if (dy < -35) setCompact(false);
    // A swipe that starts on the grid ref mustn't also copy it
    if (swipe.moved) { swallowClick = true; setTimeout(() => (swallowClick = false), 400); }
    swipe = null;
  });
  let swallowClick = false;
  $("sheet").addEventListener("click", (e) => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); swallowClick = false; } }, true);

  // ---------- navigate: map + compass to the crosshair point ----------
  let nav = null, heading = null, wakeLock = null, navLine = null, navFlag = null;
  const smooth = (prev, next) => (prev == null ? next : (prev + ((((next - prev) % 360) + 540) % 360 - 180) * 0.25 + 360) % 360);
  function onOrient(e) {
    let h = null;
    if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading; // iPhone (magnetic; ~0.5° from true in Cumbria)
    else if (e.absolute && typeof e.alpha === "number") h = 360 - e.alpha;      // Android
    if (h == null) return;
    h = (h + ((screen.orientation && screen.orientation.angle) || window.orientation || 0) + 360) % 360;
    heading = smooth(heading, h);
    if (nav) drawNav();
  }
  async function compassOn() {
    // iPhone asks permission, and only from a tap
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      try { if ((await DeviceOrientationEvent.requestPermission()) !== "granted") return false; } catch { return false; }
    }
    window.addEventListener("deviceorientationabsolute", onOrient);
    window.addEventListener("deviceorientation", onOrient);
    return true;
  }
  function compassOff() {
    window.removeEventListener("deviceorientationabsolute", onOrient);
    window.removeEventListener("deviceorientation", onOrient);
    heading = null;
  }
  function drawNav() {
    if (!nav) return;
    const to = L.latLng(nav.lat, nav.lon);
    if (!here) {
      $("navDist").textContent = "—";
      $("navBrg").textContent = "Finding you…";
      $("navAcc").textContent = "";
      return;
    }
    const me = L.latLng(here.lat, here.lon), d = me.distanceTo(to), brg = bearing(me, to);
    const arrived = d <= Math.max(8, here.acc);
    $("navDist").textContent = arrived ? "Here" : fmtDist(d);
    $("navBrg").textContent = arrived ? `Within GPS accuracy` : `Bearing ${String(Math.round(brg)).padStart(3, "0")}°`;
    $("navAcc").textContent = `You: ${OSGB.gridRef(OSGB.wgs84ToGrid(here.lat, here.lon).e, OSGB.wgs84ToGrid(here.lat, here.lon).n, digits)} · ±${Math.round(here.acc)} m`;
    $("rose").style.transform = `rotate(${-(heading || 0)}deg)`;
    $("arrow").style.transform = `rotate(${brg - (heading || 0)}deg)`;
    document.querySelector(".dial").classList.toggle("here", arrived);
    $("navHint").textContent = heading == null ? "No compass reading: the arrow assumes the top of the phone points north." : arrived ? "" : "Hold the phone flat. The arrow points the way to go.";
    const line = [me, to];
    if (navLine) navLine.setLatLngs(line);
    else navLine = L.polyline(line, { color: "#c0392b", weight: 3, dashArray: "6 8", interactive: false }).addTo(map);
    // Keep both ends on screen while walking
    const b = map.getBounds().pad(-0.1);
    if (!b.contains(me) || !b.contains(to)) fitNav();
  }
  function fitNav() {
    if (!nav) return;
    const pts = [[nav.lat, nav.lon]];
    if (here) pts.push([here.lat, here.lon]);
    map.fitBounds(L.latLngBounds(pts), { paddingTopLeft: [40, 90], paddingBottomRight: [70, sheet.offsetHeight + 30], maxZoom: 17, animate: false });
  }
  $("navBtn").onclick = async () => {
    if (!last || !last.ref) return;
    if (following) return toast("Move the crosshair to where you want to go, then tap Navigate");
    nav = { lat: last.lat, lon: last.lon, view: { c: map.getCenter(), z: map.getZoom() } };
    $("navRef").textContent = last.ref;
    document.body.classList.add("navigating");
    layout();
    navFlag = L.marker([nav.lat, nav.lon], { interactive: false, icon: L.divIcon({ className: "flag", html: "🚩", iconSize: [30, 30], iconAnchor: [6, 28] }) }).addTo(map);
    const compass = await compassOn();
    if (!compass) toast("Compass not allowed. The map and distance still work");
    startGps(false);
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch {}
    fitNav();
    drawNav();
  };
  $("navEnd").onclick = () => {
    const to = nav;
    nav = null;
    compassOff();
    if (navLine) { map.removeLayer(navLine); navLine = null; }
    if (navFlag) { map.removeLayer(navFlag); navFlag = null; }
    try { wakeLock && wakeLock.release(); } catch {}
    wakeLock = null;
    document.body.classList.remove("navigating");
    layout();
    if (to) map.setView(to.view.c, to.view.z, { animate: false }); // back exactly where you started
    update();
  };
  // The wake lock drops when the phone sleeps or the app is switched away
  document.addEventListener("visibilitychange", async () => {
    if (nav && document.visibilityState === "visible") { try { wakeLock = await navigator.wakeLock.request("screen"); } catch {} }
  });

  // ---------- save an area for offline ----------
  // Loads the map tiles for what's on screen, a couple of zoom levels deeper, so the
  // service worker keeps them. Capped to a personal-use amount, as the free map
  // servers ask: about one reserve at a time.
  async function saveArea() {
    if (current === "aerial") return toast("Aerial photos can't be saved. Switch to Topo or Street first");
    if (!navigator.onLine) return toast("Needs signal to save an area");
    const layer = LAYERS[current].layer, b = map.getBounds(), z0 = map.getZoom(), zMax = Math.min(z0 + 2, layer.options.maxZoom);
    const urls = [];
    for (let z = z0; z <= zMax; z++) {
      const nw = map.project(b.getNorthWest(), z).divideBy(256).floor(), se = map.project(b.getSouthEast(), z).divideBy(256).floor();
      for (let x = nw.x; x <= se.x; x++) for (let y = nw.y; y <= se.y; y++) {
        urls.push(L.Util.template(layer._url, { s: "abc"[(x + y) % 3], z, x, y, r: "" }));
      }
    }
    if (urls.length > 800) return toast(`That's ${urls.length} tiles. Zoom in to one reserve and try again`);
    let done = 0, failed = 0;
    toast(`Saving ${urls.length} map tiles…`);
    const queue = urls.slice();
    const worker = async () => {
      while (queue.length) {
        const u = queue.shift();
        try { const r = await fetch(u, { mode: "cors" }); if (!r.ok) failed++; } catch { failed++; }
        done++;
        if (done % 40 === 0) toast(`Saving map… ${Math.round((done / urls.length) * 100)}%`);
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    toast(failed ? `Saved, but ${failed} tiles failed. Try again on better signal` : `Area saved for offline (zoom ${z0}–${zMax})`);
  }

  // ---------- go ----------
  window.addEventListener("resize", () => { layout(); fitRef(); update(); });
  setPrec(digits);
  drawPins();
  drawGrid();
  layout();
  update();
  // Any browser (Edge and Chrome on iPhone have no service worker): ask GitHub which
  // version is current and, if this page is older, load the new one. The ?v= makes the
  // browser fetch a fresh page instead of reusing its cached copy.
  async function checkVersion() {
    try {
      const j = await (await fetch("version.json", { cache: "no-store" })).json();
      if (j.v && j.v !== VERSION && !location.search.includes("v=" + j.v)) location.replace(location.pathname + "?v=" + j.v);
    } catch {}
  }
  checkVersion();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkVersion(); });

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (hadController && !reloaded) { reloaded = true; location.reload(); }
    });
    navigator.serviceWorker.register("sw.js").then((r) => r.update()).catch(() => {});
    // Check for a new version whenever the app comes back to the front
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
    });
  }
})();
</script>
</body>
</html>
