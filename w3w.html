<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening what3words…</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; color: #1c211d; }
  @media (prefers-color-scheme: dark) { body { background: #161a17; color: #eef2ee; } }
  p { margin: 0; padding: 24px; text-align: center; }
</style>
</head>
<body>
<p>Opening what3words…</p>
<script>
  // The what3words app grabs taps on what3words links but ignores the coordinates in them,
  // so it shows your own location instead. Phones only hand a link to an app when the user
  // taps it, so forwarding from here, after the page has loaded, keeps it in the browser:
  // their web map then shows the 3 words for exactly this spot.
  var ll = (location.search.match(/[?&]ll=(-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?)/) || [])[1];
  if (ll) setTimeout(function () { location.replace("https://what3words.com/" + ll); }, 150);
  else document.querySelector("p").textContent = "No location given.";
</script>
</body>
</html>
