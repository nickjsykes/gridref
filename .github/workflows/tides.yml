# Every morning: fetch the next week of official tides for the tidal reserves into
# data/tides.json and publish it. The ADMIRALTY key lives in the repository secret
# ADMIRALTY_KEY (Settings › Secrets and variables › Actions), never in the code.
name: Tides
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch tides
        env:
          ADMIRALTY_KEY: ${{ secrets.ADMIRALTY_KEY }}
        run: python build/fetch_tides.py
      - name: Publish if changed
        run: |
          git config user.name "tides bot"
          git config user.email "tides-bot@users.noreply.github.com"
          git add data/tides.json
          git diff --cached --quiet || (git commit -m "Tides for the week" && git push)
